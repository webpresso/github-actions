name: Setup global wp
description: >
  Put a caller-pinned wp release binary on PATH. Prefers a wp already baked into
  the runner's @actions/tool-cache layout; otherwise downloads the published
  install archive wp-<target>.tar.gz (plus its wp-<target>.tar.gz.json digest
  sidecar) from the PUBLIC webpresso/app-releases repository, verifies the
  archive sha256 against the sidecar, and extracts bin/wp -- no GitHub API
  call, no token, no python3. The sidecar digest is NOT an independent trust
  root (both files come from the same release location): it guards against
  corruption and partial downloads, not a compromised release repository or a
  mirror set through release-repo. High-assurance consumers should pin the
  checksum input.

inputs:
  version:
    description: >
      Exact wp release semver without a leading v (no ranges, no dist-tags).
      Resolved against the public webpresso/app-releases release line.
    required: true
  release-repo:
    description: >
      owner/repo publishing the wp install archives. Defaults to the public
      webpresso/app-releases; override only to install from a mirror.
    required: false
    default: webpresso/app-releases
  checksum:
    description: >
      Optional sha256 of the extracted bin/wp binary (not of the archive; the
      archive is always verified against its release sidecar, which is not an
      independent trust root; pin this for high-assurance installs. It does
      not cover package-root/). When set, the
      binary is verified against it and the action fails on a mismatch. On a
      tool-cache hit the cached wp is verified against it instead (exit 16 on
      a mismatch); without it a cached wp is trusted as provisioned.
    required: false
    default: ""
  package-root:
    description: >
      Also extract package-root/ from the SAME wp-<target>.tar.gz archive as the
      binary and export WEBPRESSO_PACKAGE_ROOT and NODE_PATH. Requires no
      token, no second download and no second version, and fails closed when
      the extracted root has no catalog/. Requires wp >= 0.0.5.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install wp from the public release repository
      shell: bash
      env:
        WP_VERSION: ${{ inputs.version }}
        WP_RELEASE_REPO: ${{ inputs.release-repo }}
        WP_CHECKSUM: ${{ inputs.checksum }}
        WP_PACKAGE_ROOT: ${{ inputs.package-root }}
      run: |
        set -euo pipefail

        if [[ ! "${WP_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::setup-wp 'version' must be exact semver, got '${WP_VERSION}'"
          exit 2
        fi

        os="$(uname -s)"
        arch="$(uname -m)"
        case "${os}/${arch}" in
          Linux/x86_64|Linux/amd64)   target="linux-x64";    tool_arch="x64" ;;
          Linux/aarch64|Linux/arm64)  target="linux-arm64";  tool_arch="arm64" ;;
          Darwin/x86_64)              target="darwin-x64";   tool_arch="x64" ;;
          Darwin/arm64)               target="darwin-arm64"; tool_arch="arm64" ;;
          *)
            echo "::error::unsupported runner platform '${os}/${arch}'"
            exit 3
            ;;
        esac

        if [[ "${WP_PACKAGE_ROOT}" == "true" ]]; then
          # wp <= 0.0.4 located the package root only through a retired env
          # name this action no longer exports, so those binaries cannot find it.
          IFS=. read -r major minor patch <<< "${WP_VERSION%%[+-]*}"
          if (( major == 0 && minor == 0 && patch < 5 )); then
            echo "::error::package-root: true requires wp >= 0.0.5, got '${WP_VERSION}'"
            exit 12
          fi
        fi

        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | cut -d' ' -f1
          else
            shasum -a 256 "$1" | cut -d' ' -f1
          fi
        }

        # Cache short-circuit. Keyed on the tool-cache VERSION DIRECTORY only:
        # `wp --version` reports the product axis from a package root the
        # standalone binary does not have, so every release binary prints
        # 0.0.0 and can never identify itself. The directory name is the only
        # honest provenance signal, and it is what the runner image writes.
        cache_root="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/wp/${WP_VERSION}/${tool_arch}"
        cache_hit=false
        if [[ -x "${cache_root}/wp" ]]; then
          cache_hit=true
          echo "setup-wp: tool-cache hit for wp ${WP_VERSION} (${tool_arch}) at ${cache_root}"
          if [[ -n "${WP_CHECKSUM}" ]]; then
            cached_actual="$(sha256_of "${cache_root}/wp")"
            if [[ "${cached_actual}" != "${WP_CHECKSUM}" ]]; then
              echo "::error::sha256 mismatch for cached wp ${cache_root}/wp: expected ${WP_CHECKSUM}, got ${cached_actual}"
              exit 16
            fi
            echo "setup-wp: cached wp sha256 verified"
          fi
          echo "${cache_root}" >> "${GITHUB_PATH}"
          echo "WP_INSTALL_DIR=${cache_root}" >> "${GITHUB_ENV}"
          if [[ "${WP_PACKAGE_ROOT}" != "true" ]]; then
            exit 0
          fi
        fi

        # Flat string field out of the one-object sidecar JSON, without python.
        json_field() {
          sed -n 's/.*"'"$1"'"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$2" | head -n 1
        }

        # ONE contract: a single install archive per target plus a digest
        # sidecar. Public release assets: plain redirecting downloads, no API
        # and no token. -L is mandatory -- GitHub 302s release assets to a
        # signed asset host, and without it curl reports the redirect as a
        # failure.
        archive_name="wp-${target}.tar.gz"
        sidecar_name="${archive_name}.json"
        base_url="https://github.com/${WP_RELEASE_REPO}/releases/download/v${WP_VERSION}"
        work_dir="${RUNNER_TEMP:-/tmp}/webpresso-wp-archive"
        rm -rf "${work_dir}"
        mkdir -p "${work_dir}/stage"

        for name in "${archive_name}" "${sidecar_name}"; do
          echo "setup-wp: downloading ${base_url}/${name}"
          if ! curl -fsSL --retry 3 --retry-delay 2 -o "${work_dir}/${name}" "${base_url}/${name}"; then
            echo "::error::download failed for ${base_url}/${name} -- does release v${WP_VERSION} of ${WP_RELEASE_REPO} publish ${name}?"
            exit 6
          fi
        done

        sidecar="${work_dir}/${sidecar_name}"
        for pair in "archive:${archive_name}" "version:${WP_VERSION}" "target:${target}"; do
          field="${pair%%:*}"
          want="${pair#*:}"
          got="$(json_field "${field}" "${sidecar}")"
          if [[ "${got}" != "${want}" ]]; then
            echo "::error::sidecar ${sidecar_name} ${field} mismatch: expected '${want}', got '${got}'"
            exit 7
          fi
        done

        expected_sha="$(json_field sha256 "${sidecar}")"
        actual_sha="$(sha256_of "${work_dir}/${archive_name}")"
        if [[ -z "${expected_sha}" || "${actual_sha}" != "${expected_sha}" ]]; then
          echo "::error::sha256 mismatch for ${archive_name}: sidecar says '${expected_sha}', archive is ${actual_sha}"
          exit 8
        fi
        echo "setup-wp: archive sha256 verified against sidecar"

        # Refuse a hostile archive BEFORE the first extraction writes anything.
        # The sidecar proves integrity only, so the archive content is still
        # untrusted: only regular files and directories under relative,
        # dot-dot-free paths may pass. Two listings (names, then verbose types)
        # work identically on GNU tar and bsdtar; their line counts must agree
        # or the listing is ambiguous (e.g. a newline in a name) and is refused.
        stage="${work_dir}/stage"
        names_list="${work_dir}/entries.names"
        kinds_list="${work_dir}/entries.kinds"
        if ! tar -tzf "${work_dir}/${archive_name}" > "${names_list}" ||
           ! tar -tzvf "${work_dir}/${archive_name}" > "${kinds_list}"; then
          echo "::error::${archive_name} cannot be listed; refusing to extract"
          exit 15
        fi
        if [[ "$(wc -l < "${names_list}")" -ne "$(wc -l < "${kinds_list}")" ]]; then
          echo "::error::${archive_name} has an ambiguous entry listing; refusing to extract"
          exit 13
        fi
        while IFS= read -r entry; do
          case "${entry}" in
            /*)
              echo "::error::${archive_name} has an absolute-path entry '${entry}'; refusing to extract"
              exit 13
              ;;
          esac
          case "/${entry}/" in
            */../*)
              echo "::error::${archive_name} has a path-traversal entry '${entry}'; refusing to extract"
              exit 13
              ;;
          esac
        done < "${names_list}"
        while IFS= read -r line; do
          # bsdtar lists a ustar hardlink that claims data as a regular file
          # with a trailing "link to <target>"; refuse any link annotation.
          case "${line}" in
            *" link to "*|*" -> "*)
              echo "::error::${archive_name} has a link entry '${line}'; refusing to extract"
              exit 13
              ;;
          esac
          case "${line:0:1}" in
            -|d) ;;
            *)
              echo "::error::${archive_name} has a non-regular entry (symlink, hardlink, or device) '${line}'; refusing to extract"
              exit 13
              ;;
          esac
        done < "${kinds_list}"

        tar -xzf "${work_dir}/${archive_name}" -C "${stage}"

        for member in bin/wp package-root; do
          if [[ -L "${stage}/${member}" ]]; then
            echo "::error::${archive_name} extracted ${member} as a symlink; refusing to install"
            exit 14
          fi
        done

        # Listing text can be wrong (see above), so also inspect what actually
        # landed: only regular, singly-linked files and directories may exist.
        stray="$(find "${stage}" ! -type f ! -type d -print -quit)"
        if [[ -z "${stray}" ]]; then
          stray="$(find "${stage}" -type f -links +1 -print -quit)"
        fi
        if [[ -n "${stray}" ]]; then
          echo "::error::${archive_name} extracted a non-regular or hard-linked entry '${stray}'; refusing to install"
          exit 14
        fi

        if [[ "${cache_hit}" != "true" ]]; then
          if [[ ! -f "${stage}/bin/wp" ]]; then
            echo "::error::${archive_name} has no bin/wp"
            exit 9
          fi

          install_dir="${RUNNER_TEMP:-/tmp}/webpresso-wp"
          mkdir -p "${install_dir}"
          cp "${stage}/bin/wp" "${install_dir}/wp"
          chmod +x "${install_dir}/wp"

          if [[ -n "${WP_CHECKSUM}" ]]; then
            actual="$(sha256_of "${install_dir}/wp")"
            if [[ "${actual}" != "${WP_CHECKSUM}" ]]; then
              echo "::error::sha256 mismatch for bin/wp from ${archive_name}: expected ${WP_CHECKSUM}, got ${actual}"
              exit 5
            fi
            echo "setup-wp: sha256 verified"
          fi

          # Populate the tool cache so a later job on the same runner (and any
          # consumer probing the same path) short-circuits. Best effort: the
          # cache root is root-owned on some images, and failing to seed it is
          # not a reason to fail an otherwise successful install.
          if mkdir -p "${cache_root}" 2>/dev/null &&
             cp "${install_dir}/wp" "${cache_root}/wp.tmp" 2>/dev/null &&
             mv "${cache_root}/wp.tmp" "${cache_root}/wp" 2>/dev/null; then
            chmod +x "${cache_root}/wp" || true
            touch "$(dirname "${cache_root}")/${tool_arch}.complete" 2>/dev/null || true
            echo "setup-wp: seeded tool cache at ${cache_root}"
          fi

          echo "${install_dir}" >> "${GITHUB_PATH}"
          echo "WP_INSTALL_DIR=${install_dir}" >> "${GITHUB_ENV}"
          echo "setup-wp: installed wp ${WP_VERSION} (${archive_name}) to ${install_dir}"
        fi

        if [[ "${WP_PACKAGE_ROOT}" != "true" ]]; then
          exit 0
        fi

        # The package root is the package-root/ tree of the SAME archive: one
        # source, one version, no credential, no second download. No fallback:
        # if the archive lacks it, that is a publishing bug and it should say so.
        package_root="${RUNNER_TEMP:-/tmp}/webpresso-wp-package-root"
        rm -rf "${package_root}"
        if [[ ! -d "${stage}/package-root" ]]; then
          echo "::error::${archive_name} has no package-root/."
          exit 11
        fi
        mv "${stage}/package-root" "${package_root}"

        # Fail on the thing callers actually depend on, not just on "an archive
        # extracted". A package root without catalog/ resolves nothing.
        if [[ ! -d "${package_root}/catalog" ]]; then
          echo "::error::${archive_name} package-root/ has no catalog/; wp setup/sync/audit would fail to resolve templates."
          exit 12
        fi

        # The package root ships CODE but no node_modules, and some wp surfaces
        # need a real runtime dependency rather than only bundled source: `wp
        # audit package-surface --full` resolves `secretlint` out of the package
        # root and fails closed when it is absent. Installing wp from npm used
        # to provide that tree implicitly; the binary + package-root model does
        # not, so consumer repos lost audits that used to pass (webpresso/
        # framework #90: "secretlint is unavailable for package-surface audit").
        #
        # Restore the dependency tree the npm install model gave for free.
        # --omit=dev because only runtime deps are declared as needed;
        # --ignore-scripts because a CI consumer must never execute a
        # dependency's lifecycle script; failure is a warning, not fatal —
        # every wp surface that does NOT need a runtime dep must keep working
        # on a network-flaky runner exactly as it does today.
        if [[ -f "${package_root}/package.json" ]]; then
          if npm install --omit=dev --ignore-scripts --no-audit --no-fund \
              --prefix "${package_root}" >/dev/null 2>&1; then
            echo "package root: runtime dependencies installed"
          else
            echo "::warning::package-root runtime dependency install failed; wp surfaces needing a runtime dep (e.g. audit package-surface --full) will fail closed."
          fi
        fi

        # Node module layout so createRequire(cwd).resolve() keeps working.
        # wp still falls back to resolving the package root by its retired
        # module name (installedAppPackageRoot in webpresso/app), so the link
        # name stays until app drops that fallback.
        modules_root="${RUNNER_TEMP:-/tmp}/webpresso-node-modules"
        mkdir -p "${modules_root}/@webpresso"
        rm -rf "${modules_root}/@webpresso/agent-kit"
        ln -s "${package_root}" "${modules_root}/@webpresso/agent-kit"

        {
          echo "WEBPRESSO_PACKAGE_ROOT=${package_root}"
          echo "NODE_PATH=${modules_root}${NODE_PATH:+:${NODE_PATH}}"
        } >> "${GITHUB_ENV}"
        echo "package root: ${WP_RELEASE_REPO} v${WP_VERSION} (public, tokenless)"
