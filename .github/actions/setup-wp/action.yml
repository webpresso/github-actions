name: Setup global wp
description: >
  Put a caller-pinned wp release binary on PATH. Prefers a wp already baked into
  the runner's @actions/tool-cache layout; otherwise downloads the published
  install archive wp-<target>.tar.gz (plus its wp-<target>.tar.gz.json digest
  sidecar) from the PUBLIC webpresso/app-releases repository, verifies the
  archive sha256 against the sidecar, and extracts bin/wp -- no GitHub API
  call, no token, no python3. The sidecar digest is NOT an independent trust
  root (both files come from the same release location): it guards against
  corruption and partial downloads, not a compromised release repository or a
  mirror set through release-repo. High-assurance consumers should pin the
  checksum input. For a login-only wp (see the auth input) a second step then
  signs wp in with the job's GitHub OIDC token; wp keeps the CI entitlement
  under RUNNER_TEMP.

inputs:
  version:
    description: >
      Exact wp release semver without a leading v (no ranges, no dist-tags).
      Resolved against the public webpresso/app-releases release line.
    required: true
  release-repo:
    description: >
      owner/repo publishing the wp install archives. Defaults to the public
      webpresso/app-releases; override only to install from a mirror.
    required: false
    default: webpresso/app-releases
  checksum:
    description: >
      Optional sha256 of the extracted bin/wp binary (not of the archive; the
      archive is always verified against its release sidecar, which is not an
      independent trust root; pin this for high-assurance installs. It does
      not cover package-root/). When set, the
      binary is verified against it and the action fails on a mismatch. On a
      tool-cache hit the cached wp is verified against it instead (exit 16 on
      a mismatch); without it a cached wp is verified against the wp.sha256
      record this action seeds next to it, and a cached wp with neither is
      treated as a miss and downloaded.
    required: false
    default: ""
  auth:
    description: >
      Sign wp in after the install. auto (default) signs in when version is
      at or above 0.0.23, the first login-only wp, and does nothing for an
      older version; oidc requires a login-only version and signs in; none
      never signs in and warns for a login-only version, whose non-exempt
      commands then exit 77. Sign-in runs `wp auth ci`, which exchanges the
      job's GitHub OIDC token, so the calling job needs
      `permissions: id-token: write` (pull requests from forks receive no
      id-token). wp keeps the entitlement in its own Actions auth directory,
      RUNNER_TEMP/webpresso/auth, which later steps find without any
      exported variable and the runner deletes after the job.
    required: false
    default: auto
  entitlement:
    description: >
      Break-glass only: a Webpresso entitlement to import instead of the OIDC
      exchange, for when api.webpresso.ai cannot exchange. Pass it from
      secrets.*: the step masks it before its own output, but the runner
      prints a composite step's env first, so only a registered secret is
      masked from the start. It is piped to `wp auth import --stdin` (never
      argv or GITHUB_ENV), takes precedence over OIDC and ends with a
      warning. With a pre-login version and auth auto it is ignored with a
      warning; with auth none, or auth oidc and a pre-login version, it
      fails (exit 20).
    required: false
    default: ""
  package-root:
    description: >
      Also extract package-root/ from the SAME wp-<target>.tar.gz archive as the
      binary and export WEBPRESSO_PACKAGE_ROOT and NODE_PATH. Requires no
      token, no second download and no second version, and fails closed when
      the extracted root has no catalog/. Requires wp >= 0.0.5.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install wp from the public release repository
      shell: bash
      env:
        WP_VERSION: ${{ inputs.version }}
        WP_RELEASE_REPO: ${{ inputs.release-repo }}
        WP_CHECKSUM: ${{ inputs.checksum }}
        WP_PACKAGE_ROOT: ${{ inputs.package-root }}
      run: |
        set -euo pipefail

        if [[ ! "${WP_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::setup-wp 'version' must be exact semver, got '${WP_VERSION}'"
          exit 2
        fi

        os="$(uname -s)"
        arch="$(uname -m)"
        case "${os}/${arch}" in
          Linux/x86_64|Linux/amd64)   target="linux-x64";    tool_arch="x64" ;;
          Linux/aarch64|Linux/arm64)  target="linux-arm64";  tool_arch="arm64" ;;
          Darwin/x86_64)              target="darwin-x64";   tool_arch="x64" ;;
          Darwin/arm64)               target="darwin-arm64"; tool_arch="arm64" ;;
          *)
            echo "::error::unsupported runner platform '${os}/${arch}'"
            exit 3
            ;;
        esac

        if [[ "${WP_PACKAGE_ROOT}" == "true" ]]; then
          # wp <= 0.0.4 located the package root only through a retired env
          # name this action no longer exports, so those binaries cannot find it.
          IFS=. read -r major minor patch <<< "${WP_VERSION%%[+-]*}"
          if (( major == 0 && minor == 0 && patch < 5 )); then
            echo "::error::package-root: true requires wp >= 0.0.5, got '${WP_VERSION}'"
            exit 12
          fi
        fi

        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | cut -d' ' -f1
          else
            shasum -a 256 "$1" | cut -d' ' -f1
          fi
        }

        # Cache short-circuit. Keyed on the tool-cache VERSION DIRECTORY only:
        # `wp --version` reports the product axis from a package root the
        # standalone binary does not have, so every release binary prints
        # 0.0.0 and can never identify itself. The directory name is the only
        # honest provenance signal, and it is what the runner image writes.
        #
        # A hit is never trusted unverified. The expected digest is the
        # caller's checksum, else the wp.sha256 record this action writes
        # next to a binary it verified from a release archive; a cached wp
        # with neither is treated as a miss and downloaded again. Anything
        # that can write the tool cache can rewrite both files, so only the
        # checksum input is an independent trust root: the record catches
        # corruption and binaries of unknown provenance, not a hostile cache.
        cache_root="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/wp/${WP_VERSION}/${tool_arch}"
        cache_record="${cache_root}/wp.sha256"
        cache_hit=false
        if [[ -x "${cache_root}/wp" ]]; then
          cached_expected="${WP_CHECKSUM}"
          if [[ -z "${cached_expected}" && -f "${cache_record}" ]]; then
            read -r cached_expected _ < "${cache_record}" || true
          fi
          if [[ -z "${cached_expected}" ]]; then
            echo "setup-wp: cached wp at ${cache_root} has no checksum and no digest record; treating it as a cache miss"
          else
            cached_actual="$(sha256_of "${cache_root}/wp")"
            if [[ "${cached_actual}" != "${cached_expected}" ]]; then
              echo "::error::sha256 mismatch for cached wp ${cache_root}/wp: expected ${cached_expected}, got ${cached_actual}"
              exit 16
            fi
            cache_hit=true
            echo "setup-wp: tool-cache hit for wp ${WP_VERSION} (${tool_arch}) at ${cache_root}"
            echo "setup-wp: cached wp sha256 verified"
            echo "${cache_root}" >> "${GITHUB_PATH}"
            echo "WP_INSTALL_DIR=${cache_root}" >> "${GITHUB_ENV}"
            if [[ "${WP_PACKAGE_ROOT}" != "true" ]]; then
              exit 0
            fi
          fi
        fi

        # Flat string field out of the one-object sidecar JSON, without python.
        json_field() {
          sed -n 's/.*"'"$1"'"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$2" | head -n 1
        }

        # ONE contract: a single install archive per target plus a digest
        # sidecar. Public release assets: plain redirecting downloads, no API
        # and no token. -L is mandatory -- GitHub 302s release assets to a
        # signed asset host, and without it curl reports the redirect as a
        # failure.
        archive_name="wp-${target}.tar.gz"
        sidecar_name="${archive_name}.json"
        base_url="https://github.com/${WP_RELEASE_REPO}/releases/download/v${WP_VERSION}"
        work_dir="${RUNNER_TEMP:-/tmp}/webpresso-wp-archive"
        rm -rf "${work_dir}"
        mkdir -p "${work_dir}/stage"

        for name in "${archive_name}" "${sidecar_name}"; do
          echo "setup-wp: downloading ${base_url}/${name}"
          if ! curl -fsSL --retry 3 --retry-delay 2 -o "${work_dir}/${name}" "${base_url}/${name}"; then
            echo "::error::download failed for ${base_url}/${name} -- does release v${WP_VERSION} of ${WP_RELEASE_REPO} publish ${name}?"
            exit 6
          fi
        done

        sidecar="${work_dir}/${sidecar_name}"
        for pair in "archive:${archive_name}" "version:${WP_VERSION}" "target:${target}"; do
          field="${pair%%:*}"
          want="${pair#*:}"
          got="$(json_field "${field}" "${sidecar}")"
          if [[ "${got}" != "${want}" ]]; then
            echo "::error::sidecar ${sidecar_name} ${field} mismatch: expected '${want}', got '${got}'"
            exit 7
          fi
        done

        expected_sha="$(json_field sha256 "${sidecar}")"
        actual_sha="$(sha256_of "${work_dir}/${archive_name}")"
        if [[ -z "${expected_sha}" || "${actual_sha}" != "${expected_sha}" ]]; then
          echo "::error::sha256 mismatch for ${archive_name}: sidecar says '${expected_sha}', archive is ${actual_sha}"
          exit 8
        fi
        echo "setup-wp: archive sha256 verified against sidecar"

        # Refuse a hostile archive BEFORE the first extraction writes anything.
        # The sidecar proves integrity only, so the archive content is still
        # untrusted: only regular files and directories under relative,
        # dot-dot-free paths may pass. Two listings (names, then verbose types)
        # work identically on GNU tar and bsdtar; their line counts must agree
        # or the listing is ambiguous (e.g. a newline in a name) and is refused.
        stage="${work_dir}/stage"
        names_list="${work_dir}/entries.names"
        kinds_list="${work_dir}/entries.kinds"
        if ! tar -tzf "${work_dir}/${archive_name}" > "${names_list}" ||
           ! tar -tzvf "${work_dir}/${archive_name}" > "${kinds_list}"; then
          echo "::error::${archive_name} cannot be listed; refusing to extract"
          exit 15
        fi
        if [[ "$(wc -l < "${names_list}")" -ne "$(wc -l < "${kinds_list}")" ]]; then
          echo "::error::${archive_name} has an ambiguous entry listing; refusing to extract"
          exit 13
        fi
        while IFS= read -r entry; do
          case "${entry}" in
            /*)
              echo "::error::${archive_name} has an absolute-path entry '${entry}'; refusing to extract"
              exit 13
              ;;
          esac
          case "/${entry}/" in
            */../*)
              echo "::error::${archive_name} has a path-traversal entry '${entry}'; refusing to extract"
              exit 13
              ;;
          esac
        done < "${names_list}"
        while IFS= read -r line; do
          # bsdtar lists a ustar hardlink that claims data as a regular file
          # with a trailing "link to <target>"; refuse any link annotation.
          case "${line}" in
            *" link to "*|*" -> "*)
              echo "::error::${archive_name} has a link entry '${line}'; refusing to extract"
              exit 13
              ;;
          esac
          case "${line:0:1}" in
            -|d) ;;
            *)
              echo "::error::${archive_name} has a non-regular entry (symlink, hardlink, or device) '${line}'; refusing to extract"
              exit 13
              ;;
          esac
        done < "${kinds_list}"

        tar -xzf "${work_dir}/${archive_name}" -C "${stage}"

        for member in bin/wp package-root; do
          if [[ -L "${stage}/${member}" ]]; then
            echo "::error::${archive_name} extracted ${member} as a symlink; refusing to install"
            exit 14
          fi
        done

        # Listing text can be wrong (see above), so also inspect what actually
        # landed: only regular, singly-linked files and directories may exist.
        stray="$(find "${stage}" ! -type f ! -type d -print -quit)"
        if [[ -z "${stray}" ]]; then
          stray="$(find "${stage}" -type f -links +1 -print -quit)"
        fi
        if [[ -n "${stray}" ]]; then
          echo "::error::${archive_name} extracted a non-regular or hard-linked entry '${stray}'; refusing to install"
          exit 14
        fi

        if [[ "${cache_hit}" != "true" ]]; then
          if [[ ! -f "${stage}/bin/wp" ]]; then
            echo "::error::${archive_name} has no bin/wp"
            exit 9
          fi

          install_dir="${RUNNER_TEMP:-/tmp}/webpresso-wp"
          mkdir -p "${install_dir}"
          cp "${stage}/bin/wp" "${install_dir}/wp"
          chmod +x "${install_dir}/wp"

          if [[ -n "${WP_CHECKSUM}" ]]; then
            actual="$(sha256_of "${install_dir}/wp")"
            if [[ "${actual}" != "${WP_CHECKSUM}" ]]; then
              echo "::error::sha256 mismatch for bin/wp from ${archive_name}: expected ${WP_CHECKSUM}, got ${actual}"
              exit 5
            fi
            echo "setup-wp: sha256 verified"
          fi

          # Populate the tool cache so a later job on the same runner (and any
          # consumer probing the same path) short-circuits. Best effort: the
          # cache root is root-owned on some images, and failing to seed it is
          # not a reason to fail an otherwise successful install.
          #
          # The digest record is removed first and written only after the
          # binary it describes is in place, so an interrupted seed leaves no
          # record (a later miss) and never a record for a different binary.
          installed_sha="$(sha256_of "${install_dir}/wp")"
          if mkdir -p "${cache_root}" 2>/dev/null &&
             rm -f "${cache_record}" 2>/dev/null &&
             cp "${install_dir}/wp" "${cache_root}/wp.tmp" 2>/dev/null &&
             mv "${cache_root}/wp.tmp" "${cache_root}/wp" 2>/dev/null; then
            chmod +x "${cache_root}/wp" || true
            if printf '%s\n' "${installed_sha}" 2>/dev/null > "${cache_root}/wp.sha256.tmp" &&
               mv "${cache_root}/wp.sha256.tmp" "${cache_root}/wp.sha256" 2>/dev/null; then
              touch "$(dirname "${cache_root}")/${tool_arch}.complete" 2>/dev/null || true
              echo "setup-wp: seeded tool cache at ${cache_root}"
            fi
          fi

          echo "${install_dir}" >> "${GITHUB_PATH}"
          echo "WP_INSTALL_DIR=${install_dir}" >> "${GITHUB_ENV}"
          echo "setup-wp: installed wp ${WP_VERSION} (${archive_name}) to ${install_dir}"
        fi

        if [[ "${WP_PACKAGE_ROOT}" != "true" ]]; then
          exit 0
        fi

        # The package root is the package-root/ tree of the SAME archive: one
        # source, one version, no credential, no second download. No fallback:
        # if the archive lacks it, that is a publishing bug and it should say so.
        package_root="${RUNNER_TEMP:-/tmp}/webpresso-wp-package-root"
        rm -rf "${package_root}"
        if [[ ! -d "${stage}/package-root" ]]; then
          echo "::error::${archive_name} has no package-root/."
          exit 11
        fi
        mv "${stage}/package-root" "${package_root}"

        # Fail on the thing callers actually depend on, not just on "an archive
        # extracted". A package root without catalog/ resolves nothing.
        if [[ ! -d "${package_root}/catalog" ]]; then
          echo "::error::${archive_name} package-root/ has no catalog/; wp setup/sync/audit would fail to resolve templates."
          exit 12
        fi

        # The package root ships CODE but no node_modules, and some wp surfaces
        # need a real runtime dependency rather than only bundled source: `wp
        # audit package-surface --full` resolves `secretlint` out of the package
        # root and fails closed when it is absent. Installing wp from npm used
        # to provide that tree implicitly; the binary + package-root model does
        # not, so consumer repos lost audits that used to pass (webpresso/
        # framework #90: "secretlint is unavailable for package-surface audit").
        #
        # Restore the dependency tree the npm install model gave for free.
        # --omit=dev because only runtime deps are declared as needed;
        # --ignore-scripts because a CI consumer must never execute a
        # dependency's lifecycle script; failure is a warning, not fatal —
        # every wp surface that does NOT need a runtime dep must keep working
        # on a network-flaky runner exactly as it does today.
        if [[ -f "${package_root}/package.json" ]]; then
          if npm install --omit=dev --ignore-scripts --no-audit --no-fund \
              --prefix "${package_root}" >/dev/null 2>&1; then
            echo "package root: runtime dependencies installed"
          else
            echo "::warning::package-root runtime dependency install failed; wp surfaces needing a runtime dep (e.g. audit package-surface --full) will fail closed."
          fi
        fi

        # Node module layout so createRequire(cwd).resolve() keeps working.
        # wp still falls back to resolving the package root by its retired
        # module name (installedAppPackageRoot in webpresso/app), so the link
        # name stays until app drops that fallback.
        modules_root="${RUNNER_TEMP:-/tmp}/webpresso-node-modules"
        mkdir -p "${modules_root}/@webpresso"
        rm -rf "${modules_root}/@webpresso/agent-kit"
        ln -s "${package_root}" "${modules_root}/@webpresso/agent-kit"

        {
          echo "WEBPRESSO_PACKAGE_ROOT=${package_root}"
          echo "NODE_PATH=${modules_root}${NODE_PATH:+:${NODE_PATH}}"
        } >> "${GITHUB_ENV}"
        echo "package root: ${WP_RELEASE_REPO} v${WP_VERSION} (public, tokenless)"

    - name: Sign wp in for this job
      shell: bash
      env:
        WP_VERSION: ${{ inputs.version }}
        WP_AUTH: ${{ inputs.auth }}
        WP_ENTITLEMENT: ${{ inputs.entitlement }}
      run: |
        set -euo pipefail

        # Mask a break-glass entitlement before this step can print anything.
        if [[ -n "${WP_ENTITLEMENT}" ]]; then
          while IFS= read -r mask_line || [[ -n "${mask_line}" ]]; do
            if [[ -n "${mask_line}" ]]; then
              echo "::add-mask::${mask_line}"
            fi
          done <<< "${WP_ENTITLEMENT}"
        fi

        # The first login-only wp release. Older releases have no sign-in and
        # must keep working unchanged, so this step is a no-op for them.
        login_floor="0.0.23"

        case "${WP_AUTH}" in
          auto|oidc|none) ;;
          *)
            echo "::error::setup-wp 'auth' must be auto, oidc or none, got '${WP_AUTH}'"
            exit 20
            ;;
        esac

        if [[ ! "${WP_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::setup-wp 'version' must be exact semver, got '${WP_VERSION}'"
          exit 20
        fi

        # Compare the numeric major.minor.patch core only, so a prerelease of
        # the floor release already counts as login-only.
        at_or_above_floor() {
          local -a have want
          local i
          IFS=. read -r -a have <<< "${WP_VERSION%%[+-]*}"
          IFS=. read -r -a want <<< "${login_floor}"
          for i in 0 1 2; do
            if (( 10#${have[i]} > 10#${want[i]} )); then return 0; fi
            if (( 10#${have[i]} < 10#${want[i]} )); then return 1; fi
          done
          return 0
        }
        login_only=false
        if at_or_above_floor; then
          login_only=true
        fi

        if [[ -n "${WP_ENTITLEMENT}" ]]; then
          if [[ "${WP_AUTH}" == "none" ]]; then
            echo "::error::setup-wp 'entitlement' is set but 'auth' is none; remove the entitlement or use auth auto"
            exit 20
          fi
          if [[ "${login_only}" != "true" && "${WP_AUTH}" == "oidc" ]]; then
            echo "::error::setup-wp 'entitlement' is set with 'auth: oidc', but wp ${WP_VERSION} predates sign-in (login-only from ${login_floor})"
            exit 20
          fi
          if [[ "${login_only}" != "true" ]]; then
            # A caller that forwards the secret (for example through
            # `secrets: inherit`) before moving to a login-only wp keeps working.
            echo "::warning::setup-wp 'entitlement' is ignored: wp ${WP_VERSION} predates sign-in (login-only from ${login_floor})"
            exit 0
          fi
        fi

        if [[ "${WP_AUTH}" == "none" ]]; then
          if [[ "${login_only}" == "true" ]]; then
            echo "::warning::wp ${WP_VERSION} is login-only and setup-wp 'auth' is none: wp stays signed out and its non-exempt commands exit 77"
          fi
          exit 0
        fi

        if [[ "${login_only}" != "true" ]]; then
          if [[ "${WP_AUTH}" == "oidc" ]]; then
            echo "::error::setup-wp 'auth: oidc' needs a login-only wp (${login_floor} or later), got '${WP_VERSION}'"
            exit 20
          fi
          echo "setup-wp: wp ${WP_VERSION} predates sign-in (login-only from ${login_floor}); nothing to sign in"
          exit 0
        fi

        if [[ -z "${WP_ENTITLEMENT}" && -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
          echo "::error::wp ${WP_VERSION} is login-only and this job has no GitHub OIDC token to sign in with. Add 'permissions: id-token: write' to the job that runs setup-wp (job-level permissions replace the defaults, so list the others too). Pull requests from forks never receive an id-token."
          exit 17
        fi

        # wp owns where the CI entitlement lives: under GitHub Actions
        # (GITHUB_ACTIONS=true with RUNNER_TEMP set) its auth directory is
        # this one, whatever wp's home override says. The runner empties
        # RUNNER_TEMP after every job, so the entitlement never reaches
        # $HOME, a cache, an artifact or a persistent runner's disk. This is
        # the single place the contract is held; wp's home is never changed.
        if [[ -z "${RUNNER_TEMP:-}" || ! -d "${RUNNER_TEMP}" ]]; then
          echo "::error::setup-wp needs RUNNER_TEMP, where wp keeps the CI entitlement, but it is '${RUNNER_TEMP:-}'"
          exit 21
        fi
        auth_dir="${RUNNER_TEMP}/webpresso/auth"
        entitlement_file="${auth_dir}/entitlement.jwt"
        temp_real="$(cd -P -- "${RUNNER_TEMP}" && pwd -P)"

        # Refuse anything planted on the entitlement's path before wp writes
        # it: a symlink there would carry the write out of RUNNER_TEMP.
        for path in "${auth_dir%/auth}" "${auth_dir}"; do
          if [[ -L "${path}" || ( -e "${path}" && ! -d "${path}" ) ]]; then
            echo "::error::'${path}' must be a real directory inside RUNNER_TEMP or absent; refusing to sign in"
            exit 21
          fi
        done
        if [[ -L "${entitlement_file}" || ( -e "${entitlement_file}" && ! -f "${entitlement_file}" ) ]]; then
          echo "::error::'${entitlement_file}' exists and is not a regular file; refusing to sign in"
          exit 21
        fi

        # The installed binary by path, never by PATH lookup.
        wp_bin="${WP_INSTALL_DIR:-}/wp"
        if [[ -z "${WP_INSTALL_DIR:-}" || ! -x "${wp_bin}" ]]; then
          echo "::error::setup-wp found no installed wp at '${wp_bin}' to sign in"
          exit 18
        fi

        # wp owns the auth contract: the OIDC audience, the exchange endpoint,
        # masking the GitHub ID token and offline verification. This step
        # never requests a token, parses claims or writes the entitlement.
        # wp's output is held in a private file until the entitlement it
        # wrote is masked, and only then printed.
        capture="$(mktemp "${RUNNER_TEMP}/setup-wp-auth.XXXXXX")"
        chmod 600 "${capture}"
        trap 'rm -f "${capture}"' EXIT
        sign_in_status=0
        if [[ -n "${WP_ENTITLEMENT}" ]]; then
          echo "setup-wp: importing the break-glass entitlement"
          printf '%s' "${WP_ENTITLEMENT}" | "${wp_bin}" auth import --stdin > "${capture}" 2>&1 || sign_in_status=$?
        else
          echo "setup-wp: signing wp in with this job's GitHub OIDC token"
          "${wp_bin}" auth ci > "${capture}" 2>&1 || sign_in_status=$?
        fi

        if [[ -f "${entitlement_file}" ]]; then
          while IFS= read -r mask_line || [[ -n "${mask_line}" ]]; do
            if [[ -n "${mask_line}" && "${mask_line}" != "${WP_ENTITLEMENT}" ]]; then
              echo "::add-mask::${mask_line}"
            fi
          done < "${entitlement_file}"
        fi

        if (( sign_in_status != 0 )); then
          cat "${capture}"
          if [[ -n "${WP_ENTITLEMENT}" ]]; then
            echo "::error::wp auth import --stdin refused the break-glass entitlement (exit ${sign_in_status})"
          else
            echo "::error::wp auth ci could not exchange this job's GitHub OIDC token for a Webpresso CI entitlement (exit ${sign_in_status})"
          fi
          exit 18
        fi

        # The entitlement must be where the contract puts it: a regular file
        # whose physical directory is inside RUNNER_TEMP. Anything else means
        # wp and this action disagree, so its output (which may carry an
        # entitlement this step could not mask) is withheld.
        entitlement_dir_real=""
        if [[ -d "${auth_dir}" ]]; then
          entitlement_dir_real="$(cd -P -- "${auth_dir}" && pwd -P)"
        fi
        if [[ -L "${entitlement_file}" || ! -f "${entitlement_file}" || "${entitlement_dir_real}" != "${temp_real}"/?* ]]; then
          echo "::error::wp reported a successful sign-in, but '${entitlement_file}' is not a regular file inside RUNNER_TEMP; wp and setup-wp disagree on where the CI entitlement lives. wp's output is withheld."
          exit 19
        fi
        cat "${capture}"

        if ! status_json="$("${wp_bin}" auth status --json)"; then
          echo "::error::wp auth status --json failed after sign-in"
          exit 19
        fi
        status_field() {
          local pattern="\"${1}\"[[:space:]]*:[[:space:]]*\"([^\"]*)\""
          if [[ "${status_json}" =~ ${pattern} ]]; then
            printf '%s' "${BASH_REMATCH[1]}"
          fi
        }
        state="$(status_field state)"
        kind="$(status_field kind)"
        expires="$(status_field expiresAt)"
        if [[ "${state}" != "signed-in" || ( "${kind}" != "ci" && "${kind}" != "breakglass" ) ]]; then
          echo "::error::wp auth status reports state '${state:-unknown}' with kind '${kind:-unknown}' after sign-in; expected signed-in with kind ci or breakglass"
          exit 19
        fi

        if [[ "${kind}" == "breakglass" ]]; then
          echo "::warning::setup-wp signed wp in with a break-glass entitlement (kind breakglass, expires ${expires:-unknown}); remove the secret once the api.webpresso.ai exchange works again"
        else
          echo "setup-wp: wp signed in (kind ${kind}, expires ${expires:-unknown})"
        fi
