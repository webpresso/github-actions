name: Setup global wp
description: >
  Put a caller-pinned wp release binary on PATH. Prefers a wp already baked into
  the runner's @actions/tool-cache layout; otherwise downloads the published
  binary from the PUBLIC webpresso/app-releases repository -- no GitHub API
  call, no token, no python3.

inputs:
  version:
    description: >
      Exact wp release semver without a leading v (no ranges, no dist-tags).
      Resolved against the public webpresso/app-releases release line.
    required: true
  release-repo:
    description: >
      owner/repo publishing the wp release binaries. Defaults to the public
      webpresso/app-releases; override only to install from a mirror.
    required: false
    default: webpresso/app-releases
  checksum:
    description: >
      Optional sha256 of the downloaded binary. When set, the download is
      verified against it and the action fails on a mismatch. Ignored on a
      tool-cache hit (that binary was provisioned by the runner image).
    required: false
    default: ""
  package-root:
    description: >
      Also install the wp package root (catalog + blueprint migrations) and
      export WEBPRESSO_AGENT_KIT_ROOT / WP_AGENT_KIT_PACKAGE_ROOT / NODE_PATH.
      Read from the SAME public release as the binary, so it needs no token and
      no second version. Required by callers that run wp setup/sync/audit,
      which resolve templates and migrations from disk -- `bun build --compile`
      embeds no assets, so a bare binary cannot supply them.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install wp binary from the public release repository
      shell: bash
      env:
        WP_VERSION: ${{ inputs.version }}
        WP_RELEASE_REPO: ${{ inputs.release-repo }}
        WP_CHECKSUM: ${{ inputs.checksum }}
      run: |
        set -euo pipefail

        if [[ ! "${WP_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::setup-wp 'version' must be exact semver, got '${WP_VERSION}'"
          exit 2
        fi

        os="$(uname -s)"
        arch="$(uname -m)"
        case "${os}/${arch}" in
          Linux/x86_64|Linux/amd64)   asset="wp-linux-x64";    tool_arch="x64" ;;
          Linux/aarch64|Linux/arm64)  asset="wp-linux-arm64";  tool_arch="arm64" ;;
          Darwin/x86_64)              asset="wp-darwin-x64";   tool_arch="x64" ;;
          Darwin/arm64)               asset="wp-darwin-arm64"; tool_arch="arm64" ;;
          *)
            echo "::error::unsupported runner platform '${os}/${arch}'"
            exit 3
            ;;
        esac

        # Cache short-circuit. Keyed on the tool-cache VERSION DIRECTORY only:
        # `wp --version` reports the product axis from a package root the
        # standalone binary does not have, so every release binary prints
        # 0.0.0 and can never identify itself. The directory name is the only
        # honest provenance signal, and it is what the runner image writes.
        cache_root="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/wp/${WP_VERSION}/${tool_arch}"
        if [[ -x "${cache_root}/wp" ]]; then
          echo "setup-wp: tool-cache hit for wp ${WP_VERSION} (${tool_arch}) at ${cache_root}"
          echo "${cache_root}" >> "${GITHUB_PATH}"
          echo "WP_INSTALL_DIR=${cache_root}" >> "${GITHUB_ENV}"
          exit 0
        fi

        install_dir="${RUNNER_TEMP:-/tmp}/webpresso-wp"
        mkdir -p "${install_dir}"

        # Public release asset: a plain redirecting download, no API and no
        # token. -L is mandatory -- GitHub 302s release assets to a signed
        # asset host, and without it curl reports the redirect as a failure.
        url="https://github.com/${WP_RELEASE_REPO}/releases/download/v${WP_VERSION}/${asset}"
        echo "setup-wp: tool-cache miss; downloading ${url}"
        if ! curl -fsSL --retry 3 --retry-delay 2 -o "${install_dir}/wp" "${url}"; then
          echo "::error::download failed for ${url} -- does release v${WP_VERSION} of ${WP_RELEASE_REPO} publish ${asset}?"
          exit 6
        fi
        chmod +x "${install_dir}/wp"

        # A truncated or HTML body would still be "executable"; the real
        # binaries are ~100MB, so anything tiny is a failed download.
        size="$(wc -c < "${install_dir}/wp" | tr -d ' ')"
        if [[ "${size}" -lt 1048576 ]]; then
          echo "::error::downloaded ${asset} is only ${size} bytes; not a wp binary"
          exit 4
        fi

        if [[ -n "${WP_CHECKSUM}" ]]; then
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${install_dir}/wp" | cut -d' ' -f1)"
          else
            actual="$(shasum -a 256 "${install_dir}/wp" | cut -d' ' -f1)"
          fi
          if [[ "${actual}" != "${WP_CHECKSUM}" ]]; then
            echo "::error::sha256 mismatch for ${asset}: expected ${WP_CHECKSUM}, got ${actual}"
            exit 5
          fi
          echo "setup-wp: sha256 verified"
        fi

        # Populate the tool cache so a later job on the same runner (and any
        # consumer probing the same path) short-circuits. Best effort: the
        # cache root is root-owned on some images, and failing to seed it is
        # not a reason to fail an otherwise successful install.
        if mkdir -p "${cache_root}" 2>/dev/null &&
           cp "${install_dir}/wp" "${cache_root}/wp.tmp" 2>/dev/null &&
           mv "${cache_root}/wp.tmp" "${cache_root}/wp" 2>/dev/null; then
          chmod +x "${cache_root}/wp" || true
          touch "$(dirname "${cache_root}")/${tool_arch}.complete" 2>/dev/null || true
          echo "setup-wp: seeded tool cache at ${cache_root}"
        fi

        echo "${install_dir}" >> "${GITHUB_PATH}"
        echo "WP_INSTALL_DIR=${install_dir}" >> "${GITHUB_ENV}"
        echo "setup-wp: installed wp ${WP_VERSION} (${asset}) to ${install_dir}"

    - name: Install wp package root
      if: ${{ inputs.package-root == 'true' }}
      shell: bash
      env:
        WP_VERSION: ${{ inputs.version }}
        WP_RELEASE_REPO: ${{ inputs.release-repo }}
        PACKAGE_ROOT_ASSET: wp-package-root.tgz
      run: |
        set -euo pipefail

        # One source, one version, no credential: the package root ships as an
        # asset on the SAME public release as the binary it belongs to.
        #
        # This deliberately has no fallback. The previous implementation read
        # the private source monorepo, which forced a cross-repo token AND a pin
        # to the retired 3.x line, because the public 0.0.x line has no matching
        # source tag. Keeping that as a "fallback" would have preserved both
        # problems and let a misconfigured caller drift back onto the retired
        # line silently. If the asset is missing, that is a publishing bug and
        # it should say so.
        package_root="${RUNNER_TEMP:-/tmp}/webpresso-wp-package-root"
        rm -rf "${package_root}"
        mkdir -p "${package_root}"

        url="https://github.com/${WP_RELEASE_REPO}/releases/download/v${WP_VERSION}/${PACKAGE_ROOT_ASSET}"
        if ! curl -fsSL --retry 3 --retry-delay 2 \
             -o "${RUNNER_TEMP:-/tmp}/${PACKAGE_ROOT_ASSET}" "${url}"; then
          echo "::error::${WP_RELEASE_REPO} v${WP_VERSION} does not publish ${PACKAGE_ROOT_ASSET}."
          echo "package-root: true needs it. The release workflow must mirror the package tarball alongside the binaries."
          exit 11
        fi

        tar -xzf "${RUNNER_TEMP:-/tmp}/${PACKAGE_ROOT_ASSET}" -C "${package_root}"
        # npm pack nests everything under package/; flatten so the root is the
        # package root itself.
        if [[ -d "${package_root}/package" ]]; then
          shopt -s dotglob
          mv "${package_root}/package"/* "${package_root}/"
          rmdir "${package_root}/package"
          shopt -u dotglob
        fi

        # Fail on the thing callers actually depend on, not just on "a tarball
        # extracted". A package root without catalog/ resolves nothing.
        if [[ ! -d "${package_root}/catalog" ]]; then
          echo "::error::${PACKAGE_ROOT_ASSET} extracted but has no catalog/; wp setup/sync/audit would fail to resolve templates."
          exit 12
        fi

        # The package root ships CODE but no node_modules, and some wp surfaces
        # need a real runtime dependency rather than only bundled source: `wp
        # audit package-surface --full` resolves `secretlint` out of the package
        # root and fails closed when it is absent. Installing wp from npm used
        # to provide that tree implicitly; the binary + package-root model does
        # not, so consumer repos lost audits that used to pass (webpresso/
        # framework #90: "secretlint is unavailable for package-surface audit").
        #
        # Restore the dependency tree the npm install model gave for free.
        # --omit=dev because only runtime deps are declared as needed;
        # --ignore-scripts because a CI consumer must never execute a
        # dependency's lifecycle script; failure is a warning, not fatal —
        # every wp surface that does NOT need a runtime dep must keep working
        # on a network-flaky runner exactly as it does today.
        if [[ -f "${package_root}/package.json" ]]; then
          if npm install --omit=dev --ignore-scripts --no-audit --no-fund \
              --prefix "${package_root}" >/dev/null 2>&1; then
            echo "package root: runtime dependencies installed"
          else
            echo "::warning::package-root runtime dependency install failed; wp surfaces needing a runtime dep (e.g. audit package-surface --full) will fail closed."
          fi
        fi

        # Node module layout so createRequire(cwd).resolve() keeps working for
        # binaries that predate WEBPRESSO_AGENT_KIT_ROOT.
        modules_root="${RUNNER_TEMP:-/tmp}/webpresso-node-modules"
        mkdir -p "${modules_root}/@webpresso"
        rm -rf "${modules_root}/@webpresso/agent-kit"
        ln -s "${package_root}" "${modules_root}/@webpresso/agent-kit"

        {
          echo "WEBPRESSO_AGENT_KIT_ROOT=${package_root}"
          echo "WP_AGENT_KIT_PACKAGE_ROOT=${package_root}"
          echo "NODE_PATH=${modules_root}${NODE_PATH:+:${NODE_PATH}}"
        } >> "${GITHUB_ENV}"
        echo "package root: ${WP_RELEASE_REPO} v${WP_VERSION} (public, tokenless)"
