name: Set up Webpresso workflow toolchain
description: >
  Install the caller's pnpm (pnpm/action-setup reads package.json
  packageManager), configure Node.js, install the caller-pinned Vite+ CLI, and
  optionally install Bun.
inputs:
  node-version:
    description: "Node.js version to install"
    required: false
    default: "24.20.0"
  package-manager-cache:
    description: "actions/setup-node cache value; use pnpm or false"
    required: false
    default: "pnpm"
  install-bun:
    description: "Whether to install Bun"
    required: false
    default: "true"
  bun-version:
    description: "Bun version to install"
    required: false
    default: "1.4.2"
runs:
  using: composite
  steps:
    # No `version:`: pnpm/action-setup reads the caller's package.json
    # packageManager itself and fails when it is missing, so the caller's
    # manifest stays the single source of the pnpm version.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: ${{ inputs.package-manager-cache != 'false' }}
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager-cache }}

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: ${{ inputs.package-manager-cache == 'false' }}
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
      with:
        run-install: false

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      if: ${{ inputs.install-bun == 'true' }}
      with:
        bun-version: ${{ inputs.bun-version }}
