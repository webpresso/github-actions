name: Reusable Cloudflare production deploy

on:
  workflow_call:
    inputs:
      install_command:
        description: "Caller-owned install/bootstrap command block (provider-runtime-secretless)"
        required: true
        type: string
      verify_command:
        description: "Caller-owned verify/build command block (provider-runtime-secretless)"
        required: true
        type: string
      deploy_command:
        description: "Caller-owned production deploy block; write release_id=<id> to $GITHUB_OUTPUT to enable rollback"
        required: true
        type: string
      smoke_command:
        description: "Caller-owned provider-runtime-secretless post-deploy smoke command block"
        required: false
        default: ""
        type: string
      rollback_command:
        description: "Optional secret-gated rollback block; receives RELEASE_ID after smoke failure"
        required: false
        default: ""
        type: string
      secret_profile:
        description: "Repo-owned secret profile name from .webpresso/secrets.config.json"
        required: true
        type: string
      secret_sink:
        description: "Repo-owned run-capable secret sink from .webpresso/secrets.config.json"
        required: true
        type: string
      github_environment:
        description: "Caller-selected GitHub environment for approvals and environment-scoped secrets"
        required: true
        type: string
      checkout_ref:
        description: "Optional trusted commit/ref to check out; defaults to the triggering commit"
        required: false
        default: ""
        type: string
      doppler_identity_id:
        description: "Optional Doppler OIDC service account identity ID; when empty, ci_secret_provider_token is required"
        required: false
        default: ""
        type: string
      release_version:
        description: "Optional caller-owned release gate version exported as RELEASE_VERSION"
        required: false
        default: ""
        type: string
      deploy_github_token:
        description: "Expose caller GitHub auth to the trusted deploy block; opt in only for GitHub API work"
        required: false
        default: false
        type: boolean
      runner:
        description: "Runner label"
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      ci_secret_provider_token:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  production:
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.github_environment }}
    permissions:
      contents: read
      packages: read
      id-token: write
      # A called workflow cannot elevate the caller token. This is effective
      # only when a caller explicitly grants issues: write.
      issues: write
    env:
      DEPLOY_LANE: prd
      RELEASE_VERSION: ${{ inputs.release_version }}
      SECRET_PROFILE: ${{ inputs.secret_profile }}
      SECRET_SINK: ${{ inputs.secret_sink }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: webpresso/github-actions/.github/actions/setup-webpresso-toolchain@d0de856fd4e786ab59875afbecf55b579d83c379

      - uses: webpresso/github-actions/.github/actions/setup-wp@f02cd8018ca8885d5245e0d2e43ad4a6d2f105b2
        with:
          version: "3.3.6"
          github-token: ${{ secrets.CI_AGENT_KIT_TOKEN || github.token }}

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      - name: Validate committed secret profile and sink
        id: secret_config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const path = ".webpresso/secrets.config.json";
          if (!fs.existsSync(path)) {
            throw new Error(`Missing ${path}. Commit secret-manager metadata before using the shared deploy harness.`);
          }
          const payload = JSON.parse(fs.readFileSync(path, "utf8"));
          if (payload?.schemaVersion !== 1) {
            throw new Error(`Unsupported ${path} schema. Migrate to schemaVersion 1 before using sink-scoped deploys.`);
          }
          const secretProfile = process.env.SECRET_PROFILE ?? "";
          const secretSink = process.env.SECRET_SINK ?? "";
          if (secretProfile.length === 0) {
            throw new Error("Missing workflow_call input secret_profile.");
          }
          if (secretSink.length === 0) {
            throw new Error("Missing workflow_call input secret_sink.");
          }
          const profile = payload?.profiles?.[secretProfile];
          if (!profile || typeof profile.environment !== "string" || profile.environment.length === 0) {
            throw new Error(`Unknown secret profile "${secretProfile}" in ${path}.`);
          }
          const sink = payload?.sinks?.[secretSink];
          if (!sink) {
            throw new Error(`Unknown secret sink "${secretSink}" in ${path}.`);
          }
          if (!Array.isArray(sink.allowedOps) || !sink.allowedOps.includes("run")) {
            throw new Error(`Secret sink "${secretSink}" does not allow the run operation.`);
          }
          const provider = payload?.providers?.[profile.provider];
          if (!provider || typeof provider.project !== "string" || provider.project.length === 0) {
            throw new Error(`Invalid provider for secret profile "${secretProfile}" in ${path}.`);
          }
          if (provider.type === "infisical") {
            throw new Error(
              "Infisical is not supported by the sink-scoped reusable deploy harness: no short-lived provider token can currently be handed to wp secrets run without exporting the profile.",
            );
          }
          if (provider.type !== "doppler") {
            throw new Error(`Unsupported secret manager "${String(provider.type)}" in ${path}.`);
          }
          console.log(`manager=${provider.type}`);
          console.log(`project_id=${provider.project}`);
          console.log(`secret_environment=${profile.environment}`);
          NODE

      - name: Install caller dependencies
        id: install
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALL_COMMAND: ${{ inputs.install_command }}
        run: |
          set -euo pipefail
          bash -leo pipefail -c "$INSTALL_COMMAND"

      - name: Run caller verify block
        id: verify
        shell: bash
        env:
          VERIFY_COMMAND: ${{ inputs.verify_command }}
        run: |
          set -euo pipefail
          bash -leo pipefail -c "$VERIFY_COMMAND"

      - name: Prepare the Doppler OIDC exchange helper
        id: doppler_oidc_helper
        if: ${{ inputs.doppler_identity_id != '' }}
        shell: bash
        env:
          DOPPLER_OIDC_HELPER: ${{ runner.temp }}/webpresso-doppler-oidc.cjs
        run: |
          set -euo pipefail
          cat > "${DOPPLER_OIDC_HELPER}" <<'NODE'
          const fs = require("node:fs");

          async function main() {
            const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL ?? "";
            const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN ?? "";
            const identity = process.env.DOPPLER_IDENTITY_ID ?? "";
            if (!requestUrl || !requestToken || !identity) {
              throw new Error("Doppler OIDC requires GitHub id-token: write and a non-empty doppler_identity_id.");
            }
            const oidcResponse = await fetch(requestUrl, {
              headers: { Authorization: `Bearer ${requestToken}` },
            });
            if (!oidcResponse.ok) {
              throw new Error(`GitHub OIDC token request failed with HTTP ${oidcResponse.status}.`);
            }
            const oidcPayload = await oidcResponse.json();
            const oidcToken = typeof oidcPayload?.value === "string" ? oidcPayload.value : "";
            if (!oidcToken) throw new Error("GitHub OIDC token response did not contain a token.");
            console.log(`::add-mask::${oidcToken}`);
            const dopplerResponse = await fetch("https://api.doppler.com/v3/auth/oidc", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ identity, token: oidcToken }),
            });
            if (!dopplerResponse.ok) {
              throw new Error(`Doppler OIDC exchange failed with HTTP ${dopplerResponse.status}.`);
            }
            const dopplerPayload = await dopplerResponse.json();
            const token = typeof dopplerPayload?.token === "string" ? dopplerPayload.token : "";
            if (!token) throw new Error("Doppler OIDC exchange did not return a token.");
            console.log(`::add-mask::${token}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `token=${token}\n`, "utf8");
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE
          node --check "${DOPPLER_OIDC_HELPER}"
          chmod 700 "${DOPPLER_OIDC_HELPER}"
          printf 'path=%s\n' "${DOPPLER_OIDC_HELPER}" >> "$GITHUB_OUTPUT"

      - name: Exchange GitHub OIDC for a short-lived Doppler token
        id: doppler_oidc
        if: ${{ inputs.doppler_identity_id != '' }}
        shell: bash
        env:
          DOPPLER_IDENTITY_ID: ${{ inputs.doppler_identity_id }}
        run: |
          set -euo pipefail
          node "${{ steps.doppler_oidc_helper.outputs.path }}"

      - name: Run caller deploy block through the secret sink
        id: deploy
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ inputs.doppler_identity_id != '' && steps.doppler_oidc.outputs.token || secrets.ci_secret_provider_token }}
          DEPLOY_COMMAND: ${{ inputs.deploy_command }}
          GITHUB_TOKEN: ${{ inputs.deploy_github_token && secrets.GITHUB_TOKEN || '' }}
          GH_TOKEN: ${{ inputs.deploy_github_token && secrets.GITHUB_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [[ -z "${DOPPLER_TOKEN}" ]]; then
            echo "Doppler deploy authentication requires ci_secret_provider_token or doppler_identity_id." >&2
            exit 1
          fi
          wp secrets run --sink "${SECRET_SINK}" --profile "${SECRET_PROFILE}" -- bash -leo pipefail -c "$DEPLOY_COMMAND"

      - name: Run caller smoke block without provider runtime secrets
        id: smoke
        if: ${{ inputs.smoke_command != '' }}
        continue-on-error: true
        shell: bash
        env:
          SMOKE_COMMAND: ${{ inputs.smoke_command }}
        run: |
          set -euo pipefail
          bash -leo pipefail -c "$SMOKE_COMMAND"

      - name: Exchange rollback OIDC for a fresh short-lived Doppler token
        id: doppler_rollback_oidc
        if: ${{ always() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure' && inputs.rollback_command != '' && inputs.doppler_identity_id != '' }}
        shell: bash
        env:
          DOPPLER_IDENTITY_ID: ${{ inputs.doppler_identity_id }}
        run: |
          set -euo pipefail
          node "${{ steps.doppler_oidc_helper.outputs.path }}"

      - name: Roll back the deployed release after smoke failure
        id: rollback
        if: ${{ always() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure' && inputs.rollback_command != '' }}
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ inputs.doppler_identity_id != '' && steps.doppler_rollback_oidc.outputs.token || secrets.ci_secret_provider_token }}
          RELEASE_ID: ${{ steps.deploy.outputs.release_id }}
          ROLLBACK_COMMAND: ${{ inputs.rollback_command }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_ID}" ]]; then
            echo "rollback_command requires deploy_command to write release_id=<id> to GITHUB_OUTPUT." >&2
            exit 1
          fi
          if [[ -z "${DOPPLER_TOKEN}" ]]; then
            echo "Doppler rollback authentication requires ci_secret_provider_token or doppler_identity_id." >&2
            exit 1
          fi
          wp secrets run --sink "${SECRET_SINK}" --profile "${SECRET_PROFILE}" -- bash -leo pipefail -c "$ROLLBACK_COMMAND"

      - name: Preserve smoke failure after rollback
        id: smoke_failure
        if: ${{ always() && steps.smoke.outcome == 'failure' }}
        shell: bash
        run: |
          echo "Post-deploy smoke verification failed; any configured rollback has finished." >&2
          exit 1
