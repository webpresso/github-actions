name: Reusable Webpresso security

on:
  workflow_call:
    inputs:
      install_command:
        description: "Caller-owned install/bootstrap command block"
        required: true
        type: string
      security_command:
        description: "Caller-owned security command block"
        required: true
        type: string
      runner:
        description: "Runner label"
        required: false
        default: ubuntu-latest
        type: string
      wp_version:
        description: "Exact stable wp version (major.minor.patch only; no suffixes, ranges, or floating tags)"
        required: false
        default: "0.0.6"
        type: string
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  security:
    name: security
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            ./

      - uses: webpresso/github-actions/.github/actions/setup-webpresso-toolchain@f9047de30cb95d1f7ca476ec23ef46c93ac6491d

      - name: Validate wp_version input
        shell: bash
        env:
          WP_VERSION_INPUT: ${{ inputs.wp_version }}
        run: |
          node -e 'const v = process.env.WP_VERSION_INPUT; const stableVersion = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.exec(v); const ok = stableVersion !== null && stableVersion[0].length === v.length; if (!ok) { console.error(`wp_version must be an exact stable major.minor.patch version (no leading zeros, suffixes, ranges, whitespace, or v prefix), got "${v}"`); process.exit(1); }'

      - uses: webpresso/github-actions/.github/actions/setup-wp@2003ca953f336efb779165f748e1ad8408565428
        with:
          version: ${{ inputs.wp_version }}

      - name: Install caller dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALL_COMMAND: ${{ inputs.install_command }}
        run: |
          set -euo pipefail
          bash -leo pipefail -c "$INSTALL_COMMAND"

      - name: Run caller security block
        shell: bash
        env:
          SECURITY_COMMAND: ${{ inputs.security_command }}
        run: |
          set -euo pipefail
          bash -leo pipefail -c "$SECURITY_COMMAND"
