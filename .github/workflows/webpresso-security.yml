name: Reusable Webpresso security

on:
  workflow_call:
    inputs:
      install_command:
        description: "Caller-owned install/bootstrap command block"
        required: true
        type: string
      security_command:
        description: "Caller-owned security command block"
        required: true
        type: string
      runner:
        description: "Runner label"
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      CI_AGENT_KIT_TOKEN:
        # DEPRECATED and no longer used. setup-wp now installs wp from the
        # PUBLIC webpresso/app-releases repo, so the binary needs no credential.
        # It is still declared because removing a secret from a reusable
        # workflow is a breaking change for any caller that still passes it --
        # GitHub rejects an undeclared secret outright. Drop it once no caller
        # passes it.
        #
        # NOTE for callers running catalog-dependent wp commands (`wp audit`,
        # `wp sync`, `wp setup`): the new action installs a bare binary and does
        # NOT export WEBPRESSO_AGENT_KIT_ROOT unless you pass `package-root:
        # true` (which does need a token, plus package-root-ref). Those command
        # strings are caller-supplied, so this repo cannot check them for you.
        description: >-
          Deprecated; unused. Kept for caller compatibility. See package-root on
          the setup-wp action if you need the agent-kit catalog assets.
        required: false


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  security:
    name: security
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

      - uses: webpresso/github-actions/.github/actions/setup-webpresso-toolchain@d0de856fd4e786ab59875afbecf55b579d83c379

      - uses: webpresso/github-actions/.github/actions/setup-wp@a52051119fb868cc1f7ebb2fcdaba769ff116475
        with:
          version: "0.0.2"

      - name: Install caller dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALL_COMMAND: ${{ inputs.install_command }}
        run: |
          set -euo pipefail
          bash -leo pipefail -c "$INSTALL_COMMAND"

      - name: Run caller security block
        shell: bash
        env:
          SECURITY_COMMAND: ${{ inputs.security_command }}
        run: |
          set -euo pipefail
          bash -leo pipefail -c "$SECURITY_COMMAND"
