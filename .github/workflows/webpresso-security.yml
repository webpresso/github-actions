name: Reusable Webpresso security

on:
  workflow_call:
    inputs:
      install_command:
        description: "Caller-owned install/bootstrap command block"
        required: true
        type: string
      security_command:
        description: "Caller-owned security command block"
        required: true
        type: string
      runner:
        description: "Runner label"
        required: false
        default: ubuntu-latest
        type: string
      # Optional WITH A DEFAULT, deliberately: a caller moving its pin keeps a
      # pre-login wp and selects the login-only release (0.0.23 or later) by
      # this input, so the pin can move before that release exists. Forwarded
      # verbatim to setup-wp `version`, whose exact-semver check is the only
      # guard. The default must publish install archives (0.0.16 or later).
      wp_version:
        description: "Exact wp release semver installed by setup-wp; 0.0.23 or later is login-only and signs in with the job's GitHub OIDC token"
        required: false
        default: "0.0.21"
        type: string
    secrets:
      # Break-glass only, for when api.webpresso.ai cannot exchange the job's
      # OIDC token. Forwarded to setup-wp `entitlement` and nowhere else, and
      # only when the caller passes it: the `security` job declares no
      # `environment:`, and a job that calls a reusable workflow cannot declare
      # one, so an environment secret never reaches it. Break-glass is a
      # short-lived repository secret passed explicitly as
      # `wp_entitlement: ${{ secrets.WP_ENTITLEMENT }}` and deleted afterwards.
      # Below the login-only floor setup-wp ignores it with a warning, so
      # passing it (or `secrets: inherit`) is safe before wp_version moves.
      wp_entitlement:
        required: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # The third-party scanners run in their own job, without `id-token: write`:
  # that grant is job-wide, so in the wp job they could mint OIDC tokens for
  # any audience and read the wp CI entitlement.
  scan:
    name: scan
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            ./

  security:
    name: security
    needs: scan
    # Runs whatever `scan` concluded, so a failed scan fails this check
    # instead of skipping it: branch protection counts a skipped required
    # check as passing. The first step refuses unless `scan` succeeded, so
    # the caller's commands still run only after both scanners passed.
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: read
      # wp 0.0.23 and later signs in with the job's GitHub OIDC token. The
      # grant is job-wide (every later step can mint a token and read the
      # entitlement), so it stays on jobs that run wp only.
      id-token: write
    steps:
      - name: Require the secret and dependency scans
        if: ${{ needs.scan.result != 'success' }}
        shell: bash
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          echo "::error::The scan job (Gitleaks and OSV Scanner) ended '${SCAN_RESULT}'; the caller's security block runs only after both scanners pass."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: webpresso/github-actions/.github/actions/setup-webpresso-toolchain@f9047de30cb95d1f7ca476ec23ef46c93ac6491d

      # `auth` stays setup-wp's default, auto: below the login-only floor
      # (0.0.23) the sign-in step does nothing; at or above it, it signs wp in
      # for this job with the job's OIDC token, or with the break-glass
      # entitlement when the caller passed one.
      - uses: webpresso/github-actions/.github/actions/setup-wp@cd003ce04712ed5c7f24c3724969d81e35353d97
        with:
          version: ${{ inputs.wp_version }}
          entitlement: ${{ secrets.wp_entitlement }}

      - name: Install caller dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALL_COMMAND: ${{ inputs.install_command }}
        run: |
          set -euo pipefail
          bash -leo pipefail -c "$INSTALL_COMMAND"

      - name: Run caller security block
        shell: bash
        env:
          SECURITY_COMMAND: ${{ inputs.security_command }}
        run: |
          set -euo pipefail
          bash -leo pipefail -c "$SECURITY_COMMAND"
