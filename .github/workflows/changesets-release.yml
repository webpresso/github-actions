name: Reusable Changesets release prep

on:
  workflow_call:
    inputs:
      install_command:
        description: "Caller-owned install/bootstrap command block"
        required: true
        type: string
      version_command:
        description: "Caller-owned Changesets version command block"
        required: false
        default: pnpm run version
        type: string
      publish_command:
        description: "Caller-owned post-version release preparation command block"
        required: false
        default: pnpm run release:publish
        type: string
      # Optional WITH A DEFAULT, deliberately: every existing SHA-pinned caller
      # keeps working untouched and opts in only by passing a value. A required
      # input would break each pinned consumer the moment they moved the pin.
      require_checks:
        description: "Optional comma/newline-separated check-run NAMES that must have completed successfully before this job does anything; empty disables the gate"
        required: false
        default: ""
        type: string
      require_checks_timeout_seconds:
        description: "Hard upper bound on the require_checks wait"
        required: false
        default: 900
        type: number
      # A CALLER CANNOT SET `timeout-minutes` on a job that `uses:` a reusable
      # workflow -- the key is not allowed on a `uses:` job -- so the only place
      # this bound can live is here, exposed as an input. This ADDS A MISSING
      # bound rather than raising one: the job had none at all, so a hung
      # release held the caller's concurrency lock until GitHub's 6h default.
      job_timeout_minutes:
        description: "Hard upper bound on the whole release-prep job, in minutes"
        required: false
        default: 30
        type: number
      runner:
        description: "Runner label"
        required: false
        default: ubuntu-latest
        type: string
    outputs:
      published:
        description: "Whether the post-version release preparation path ran"
        value: ${{ jobs.release.outputs.published }}
      release_version:
        description: "Resolved release version from the caller publish result"
        value: ${{ jobs.release.outputs.release_version }}
      publish_state:
        description: "Caller-defined terminal release-prep state"
        value: ${{ jobs.release.outputs.publish_state }}
      should_deploy:
        description: "Whether the caller should proceed to production deploy finalization"
        value: ${{ jobs.release.outputs.should_deploy }}
      package_name:
        description: "Caller package name reported by the release-prep result"
        value: ${{ jobs.release.outputs.package_name }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    permissions:
      contents: write
      pull-requests: write
      packages: write
      # A job-level `permissions:` block REPLACES the default token scopes
      # rather than merging with them, so `checks: read` has to be listed here
      # alongside every grant this job already needed -- adding it is not
      # additive to an implicit default. Required by the require_checks step
      # below (the check-runs API 403s without it, and the action aborts
      # immediately rather than masquerading the failure as "not yet appeared").
      checks: read
    outputs:
      published: ${{ steps.publish_result.outputs.published }}
      release_version: ${{ steps.publish_result.outputs.release_version }}
      publish_state: ${{ steps.publish_result.outputs.publish_state }}
      should_deploy: ${{ steps.publish_result.outputs.should_deploy }}
      package_name: ${{ steps.publish_result.outputs.package_name }}
    steps:
      # THE FIRST STEP OF THE JOB, deliberately: before actions/checkout, before
      # toolchain setup, and strictly before the caller's install block or any
      # registry/GitHub credential reaches a command. A caller that must not cut
      # a release from an unproven commit fails here having spent no setup time.
      #
      # Referenced by its REMOTE `owner/repo/path@sha` form, never `./…`: inside
      # a reusable workflow a relative `uses:` resolves against the CALLER's
      # checkout, which does not exist at this point in the job -- checkout has
      # not run, and running it first would defeat the point of gating before
      # setup. The pin is a full commit SHA that is REACHABLE from this
      # repository's default branch; Actions refuses to resolve a `uses:` pin to
      # an unreachable commit (e.g. one left behind by a squash-merged, deleted
      # branch) and reports only an opaque "workflow file issue" with zero jobs
      # created.
      #
      # `ref` is intentionally NOT passed: this workflow has no checkout_ref
      # input, so the commit under release is the triggering one and the
      # action's own default is exactly right (the PR head SHA on a
      # pull_request event, because `github.sha` there is the ephemeral merge
      # commit and carries zero check runs; `github.sha` everywhere else).
      # Restating it here would only create a second place to drift.
      - name: Wait for required checks
        id: require_checks
        if: ${{ inputs.require_checks != '' }}
        uses: webpresso/github-actions/.github/actions/wait-for-checks@8feb6b86fc96738757ba436c576a5e933d501293
        with:
          contexts: ${{ inputs.require_checks }}
          timeout-seconds: ${{ inputs.require_checks_timeout_seconds }}

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: webpresso/github-actions/.github/actions/setup-webpresso-toolchain@d0de856fd4e786ab59875afbecf55b579d83c379
        with:
          package-manager-cache: "false"

      - uses: webpresso/github-actions/.github/actions/setup-wp@a52051119fb868cc1f7ebb2fcdaba769ff116475
        with:
          version: "0.0.5"

      - name: Install caller dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALL_COMMAND: ${{ inputs.install_command }}
        run: |
          set -euo pipefail
          bash -leo pipefail -c "$INSTALL_COMMAND"

      - name: Reset release-prep handoff
        shell: bash
        run: rm -f "$RUNNER_TEMP/release-publish-result.json"

      - name: Create Release Pull Request or prepare a deployable release
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1 branch
        with:
          version: ${{ inputs.version_command }}
          publish: ${{ inputs.publish_command }}
          createGithubReleases: false
          commit: Version Packages
          title: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
          RELEASE_PUBLISH_RESULT_FILE: ${{ runner.temp }}/release-publish-result.json

      - name: Read explicit release-prep result
        id: publish_result
        shell: bash
        run: |
          set -euo pipefail
          result_file="$RUNNER_TEMP/release-publish-result.json"
          if [ ! -f "$result_file" ]; then
            {
              echo "published=false"
              echo "release_version="
              echo "publish_state=missing"
              echo "should_deploy=false"
              echo "package_name="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          package_name=$(node -e "const data=require(process.argv[1]); process.stdout.write(String(data.packageName ?? ''))" "$result_file")
          release_version=$(node -e "const data=require(process.argv[1]); process.stdout.write(String(data.version ?? ''))" "$result_file")
          publish_state=$(node -e "const data=require(process.argv[1]); process.stdout.write(String(data.publishState ?? 'missing'))" "$result_file")
          should_deploy=false
          case "$publish_state" in
            published|already-published|prepared|already-prepared)
              should_deploy=true
              ;;
          esac

          {
            echo "published=true"
            echo "package_name=$package_name"
            echo "release_version=$release_version"
            echo "publish_state=$publish_state"
            echo "should_deploy=$should_deploy"
          } >> "$GITHUB_OUTPUT"
