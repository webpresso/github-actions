name: Self-test

# This repository ships reusable workflows and composite actions; its contract
# tests treat that YAML as data. Until this workflow existed the suites ran
# only when a developer remembered two undocumented local commands, so a broken
# contract could merge unnoticed. This is the gate that makes them binding.
#
# One toolchain, one command. The suite runs under `bun test` with zero npm
# dependencies and no package.json (`Bun.YAML` is built in). `node` is still
# used inside the tests to execute the workflows' embedded scripts -- that is
# what the Actions runner does -- and ships preinstalled on ubuntu-latest.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Structural contracts over the workflow/action YAML (pins, permissions,
      # secret-sink scoping, toolchain wiring) plus behavioral contracts: the
      # embedded scan scripts are extracted from their heredocs and executed
      # under node against real git fixtures.
      - name: Contract tests
        run: bun test

  # These hosted runner cases exercise the public composite consumers use. The
  # fixture matrix is deliberately non-default: a success must come from the
  # caller manifest/catalog + lockfile, not setup-vp's latest fallback.
  setup-vp-resolution:
    needs: contract-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: manifest-range
            expected_version: "0.1.0"
          - fixture: named-catalog
            expected_version: "0.1.1"
          - fixture: unresolved-named-catalog
            expected_version: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write caller fixture
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          set -euo pipefail
          cat > package.json <<'JSON'
          {
            "private": true,
            "packageManager": "pnpm@10.18.2",
            "devDependencies": {
              "vite-plus": "PLACEHOLDER"
            }
          }
          JSON

          case "${FIXTURE}" in
            manifest-range)
              sed -i.bak 's/PLACEHOLDER/^0.1.0/' package.json
              rm package.json.bak
              cat > pnpm-lock.yaml <<'YAML'
          lockfileVersion: '9.0'
          importers:
            .:
              devDependencies:
                vite-plus:
                  specifier: ^0.1.0
                  version: 0.1.0
          YAML
              ;;
            named-catalog)
              sed -i.bak 's/PLACEHOLDER/catalog:vp/' package.json
              rm package.json.bak
              cat > pnpm-workspace.yaml <<'YAML'
          catalogs:
            vp:
              vite-plus: 0.1.1
          YAML
              cat > pnpm-lock.yaml <<'YAML'
          lockfileVersion: '9.0'
          importers:
            .:
              devDependencies:
                vite-plus:
                  specifier: catalog:vp
                  version: 0.1.1
          YAML
              ;;
            unresolved-named-catalog)
              sed -i.bak 's/PLACEHOLDER/catalog:missing/' package.json
              rm package.json.bak
              cat > pnpm-workspace.yaml <<'YAML'
          catalogs:
            vp:
              vite-plus: 0.1.1
          YAML
              printf "lockfileVersion: '9.0'\n" > pnpm-lock.yaml
              ;;
            *)
              echo "::error::unknown fixture ${FIXTURE}"
              exit 1
              ;;
          esac

      - id: toolchain
        continue-on-error: ${{ matrix.fixture == 'unresolved-named-catalog' }}
        uses: ./.github/actions/setup-webpresso-toolchain

      - name: Assert setup-vp resolution outcome
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_VERSION: ${{ matrix.expected_version }}
          FIXTURE: ${{ matrix.fixture }}
          OUTCOME: ${{ steps.toolchain.outcome }}
        run: |
          set -euo pipefail
          if [[ "${FIXTURE}" == "unresolved-named-catalog" ]]; then
            if [[ "${OUTCOME}" != "failure" ]]; then
              echo "::error::setup-vp accepted unresolved catalog:missing"
              exit 1
            fi
            echo "::notice::unresolved-named-catalog rejected"
            exit 0
          fi

          if [[ "${OUTCOME}" != "success" ]]; then
            echo "::error::setup-vp failed ${FIXTURE}: ${OUTCOME}"
            exit 1
          fi
          actual="$(vp --version)"
          if [[ "${actual}" != *"${EXPECTED_VERSION}"* ]]; then
            echo "::error::expected ${FIXTURE} to resolve ${EXPECTED_VERSION}, got ${actual}"
            exit 1
          fi

  # A partial cache entry is reseeded from the public release, then transferred
  # to a fresh runner. The hit job has no seed-job PATH or env state to reuse.
  setup-wp-cache-seed:
    needs: contract-tests
    runs-on: ubuntu-latest
    env:
      WP_VERSION: "0.0.6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure writable runner cache
        shell: bash
        run: echo "RUNNER_TOOL_CACHE=${RUNNER_TEMP}/setup-wp-tool-cache" >> "${GITHUB_ENV}"

      - name: Create a partial cache entry
        shell: bash
        run: |
          set -euo pipefail
          expected="${RUNNER_TOOL_CACHE}/wp/${WP_VERSION}/x64/wp"
          mkdir -p "$(dirname "${expected}")"
          : > "${expected}"
          chmod 0644 "${expected}"
          if [[ -x "${expected}" ]]; then
            echo "::error::partial fixture is unexpectedly executable"
            exit 1
          fi

      - uses: ./.github/actions/setup-wp
        with:
          version: ${{ env.WP_VERSION }}

      - name: Verify reseed and archive the exact cache subtree
        shell: bash
        run: |
          set -euo pipefail
          expected="${RUNNER_TOOL_CACHE}/wp/${WP_VERSION}/x64/wp"
          if [[ ! -x "${expected}" ]]; then
            echo "::error::setup-wp did not safely reseed ${expected}"
            exit 1
          fi
          "${expected}" --help >/dev/null
          tar -C "${RUNNER_TOOL_CACHE}" -czf "${RUNNER_TEMP}/setup-wp-cache.tgz" "wp/${WP_VERSION}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setup-wp-cache
          path: ${{ runner.temp }}/setup-wp-cache.tgz
          if-no-files-found: error

  setup-wp-cache-hit:
    needs: setup-wp-cache-seed
    runs-on: ubuntu-latest
    env:
      WP_VERSION: "0.0.6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure writable runner cache
        shell: bash
        run: echo "RUNNER_TOOL_CACHE=${RUNNER_TEMP}/setup-wp-tool-cache" >> "${GITHUB_ENV}"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: setup-wp-cache
          path: ${{ runner.temp }}/setup-wp-seed

      - name: Restore the seeded cache into this fresh runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TOOL_CACHE}"
          tar -xzf "${RUNNER_TEMP}/setup-wp-seed/setup-wp-cache.tgz" -C "${RUNNER_TOOL_CACHE}"
          test -x "${RUNNER_TOOL_CACHE}/wp/${WP_VERSION}/x64/wp"

      - uses: ./.github/actions/setup-wp
        with:
          version: ${{ env.WP_VERSION }}
          release-repo: webpresso/does-not-exist

      - name: Verify the fresh runner cache hit
        shell: bash
        run: |
          set -euo pipefail
          expected="${RUNNER_TOOL_CACHE}/wp/${WP_VERSION}/x64/wp"
          if [[ "${WP_INSTALL_DIR}" != "$(dirname "${expected}")" ]]; then
            echo "::error::setup-wp did not publish the cache install directory"
            exit 1
          fi
          if [[ "$(command -v wp)" != "${expected}" ]]; then
            echo "::error::setup-wp did not publish the cache executable"
            exit 1
          fi
          "${expected}" --help >/dev/null

  # The contract suite proves the wait-for-checks polling program against a
  # mocked API. These two jobs prove the composite against the REAL check-runs
  # API on this very commit: one commit, one green check, one name that cannot
  # exist. They are the only part of the action's behaviour a mock cannot
  # establish -- that the endpoint, the default token scope, and the check-run
  # naming are what the program assumes.
  #
  # `uses: ./…` needs a checkout because the action lives in the repo under
  # test; consumers reference it as
  # `webpresso/github-actions/.github/actions/wait-for-checks@<sha>` and need no
  # checkout at all, which is the point of the action being checkout-free.
  wait-for-checks-success:
    needs: contract-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `contract-tests` is completed and green by the time this job starts, so
      # the wait must observe a real success and return promptly.
      - uses: ./.github/actions/wait-for-checks
        with:
          contexts: contract-tests
          timeout-seconds: 120
          poll-interval-seconds: 5

  # The three reusable workflows reference this composite by its REMOTE
  # `owner/repo/path@sha` form, because a relative `uses:` inside a reusable
  # workflow resolves against the CALLER's checkout -- which does not exist
  # before `actions/checkout`, and the gate step must run before it.
  #
  # A remote pin only resolves while the commit stays REACHABLE from a branch.
  # An unreachable pin (the classic source: a squash-merged PR branch that was
  # then deleted) fails with an opaque "workflow file issue" and zero jobs
  # created, which is close to undiagnosable from a consumer's side. This job
  # exercises the exact pinned reference on every pull request, so that failure
  # surfaces here rather than in someone's production deploy. It deliberately
  # takes no checkout: the remote form needs none, which is the whole point.
  wait-for-checks-remote-pin:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: webpresso/github-actions/.github/actions/wait-for-checks@8feb6b86fc96738757ba436c576a5e933d501293
        with:
          contexts: contract-tests
          timeout-seconds: 120
          poll-interval-seconds: 5

  wait-for-checks-bounded-failure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record start time
        shell: bash
        run: |
          set -euo pipefail
          echo "WAIT_START=$(date +%s)" >> "$GITHUB_ENV"

      - id: bounded
        continue-on-error: true
        uses: ./.github/actions/wait-for-checks
        with:
          contexts: this-context-does-not-exist
          timeout-seconds: 30
          poll-interval-seconds: 5

      - name: Assert the wait failed inside its bound and said why
        id: assert
        shell: bash
        env:
          OUTCOME: ${{ steps.bounded.outcome }}
          # The `states` output, not the step summary: the runner gives every
          # step its own GITHUB_STEP_SUMMARY file, so a later step reading that
          # variable would read an empty file and the assertion would be
          # vacuous. (It was, until CI caught it.)
          STATES: ${{ steps.bounded.outputs.states }}
        run: |
          set -euo pipefail
          elapsed=$(( $(date +%s) - WAIT_START ))

          if [[ "${OUTCOME}" != "failure" ]]; then
            echo "::error::expected the bounded wait to fail, got '${OUTCOME}'"
            exit 1
          fi

          # Bounded: a 30s wait that ran for minutes would mean the deadline is
          # not enforced, which is the whole contract.
          if (( elapsed > 90 )); then
            echo "::error::the 30s bounded wait took ${elapsed}s"
            exit 1
          fi

          # A never-observed context and a pending one imply different fixes, so
          # the failure must not conflate them.
          if [[ "${STATES}" != "this-context-does-not-exist=NEVER OBSERVED" ]]; then
            echo "::error::expected a NEVER OBSERVED state for a context that produced no check run, got '${STATES}'"
            exit 1
          fi

          echo "bounded wait failed in ${elapsed}s and reported: ${STATES}"
