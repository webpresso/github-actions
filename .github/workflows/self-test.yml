name: Self-test

# This repository ships reusable workflows and composite actions; its contract
# tests treat that YAML as data. Until this workflow existed the suites ran
# only when a developer remembered two undocumented local commands, so a broken
# contract could merge unnoticed. This is the gate that makes them binding.
#
# One toolchain, one command. The suite runs under `bun test` with zero npm
# dependencies (`Bun.YAML` is built in; the root package.json is only a
# private workspace marker for `wp format`). `node` is still
# used inside the tests to execute the workflows' embedded scripts -- that is
# what the Actions runner does -- and ships preinstalled on ubuntu-latest.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Structural contracts over the workflow/action YAML (pins, permissions,
      # secret-sink scoping, toolchain wiring) plus behavioral contracts: the
      # embedded scan scripts are extracted from their heredocs and executed
      # under node against real git fixtures.
      - name: Contract tests
        run: bun test

  # setup-vp falls back to the moving latest release for an unresolved catalog.
  # Capture that value in its own job so the fixed valid routes can prove they
  # did not silently take the same fallback.
  setup-vp-fallback:
    needs: contract-tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write unresolved catalog fixture
        shell: bash
        run: |
          set -euo pipefail
          cat > package.json <<'JSON'
          {
            "private": true,
            "packageManager": "pnpm@10.18.2",
            "devDependencies": {
              "vite-plus": "catalog:missing"
            }
          }
          JSON
          cat > pnpm-workspace.yaml <<'YAML'
          catalogs:
            vp:
              vite-plus: 0.1.1
          YAML
          printf "lockfileVersion: '9.0'\n" > pnpm-lock.yaml

      - uses: ./.github/actions/setup-webpresso-toolchain
        with:
          package-manager-cache: false

      - id: version
        name: Capture fallback Vite+ version
        shell: bash
        run: |
          set -euo pipefail
          version="$(vp --version | sed -nE 's/.*v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n 1)"
          if [[ -z "${version}" ]]; then
            echo "::error::could not parse fallback Vite+ version"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  # These hosted runner cases exercise the public composite consumers use. The
  # fixture matrix is deliberately non-default: a success must come from the
  # caller manifest/catalog + lockfile, not setup-vp's latest fallback.
  setup-vp-resolution:
    needs: setup-vp-fallback
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: manifest-range
            expected_version: "0.1.0"
          - fixture: named-catalog
            expected_version: "0.1.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write caller fixture
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          set -euo pipefail
          cat > package.json <<'JSON'
          {
            "private": true,
            "packageManager": "pnpm@10.18.2",
            "devDependencies": {
              "vite-plus": "PLACEHOLDER"
            }
          }
          JSON

          case "${FIXTURE}" in
            manifest-range)
              sed -i.bak 's/PLACEHOLDER/^0.1.0/' package.json
              rm package.json.bak
              cat > pnpm-lock.yaml <<'YAML'
          lockfileVersion: '9.0'
          importers:
            .:
              devDependencies:
                vite-plus:
                  specifier: ^0.1.0
                  version: 0.1.0
          YAML
              ;;
            named-catalog)
              sed -i.bak 's/PLACEHOLDER/catalog:vp/' package.json
              rm package.json.bak
              cat > pnpm-workspace.yaml <<'YAML'
          catalogs:
            vp:
              vite-plus: 0.1.1
          YAML
              cat > pnpm-lock.yaml <<'YAML'
          lockfileVersion: '9.0'
          importers:
            .:
              devDependencies:
                vite-plus:
                  specifier: catalog:vp
                  version: 0.1.1
          YAML
              ;;
            *)
              echo "::error::unknown fixture ${FIXTURE}"
              exit 1
              ;;
          esac

      - id: toolchain
        uses: ./.github/actions/setup-webpresso-toolchain
        with:
          package-manager-cache: false

      - name: Assert setup-vp resolution outcome
        shell: bash
        env:
          EXPECTED_VERSION: ${{ matrix.expected_version }}
          FALLBACK_VERSION: ${{ needs.setup-vp-fallback.outputs.version }}
          FIXTURE: ${{ matrix.fixture }}
          OUTCOME: ${{ steps.toolchain.outcome }}
        run: |
          set -euo pipefail
          if [[ "${OUTCOME}" != "success" ]]; then
            echo "::error::setup-vp failed ${FIXTURE}: ${OUTCOME}"
            exit 1
          fi
          if [[ -z "${FALLBACK_VERSION}" || "${EXPECTED_VERSION}" == "${FALLBACK_VERSION}" ]]; then
            echo "::error::${FIXTURE} does not differ from the captured fallback ${FALLBACK_VERSION}"
            exit 1
          fi
          actual="$(vp --version)"
          if [[ "${actual}" != *"${EXPECTED_VERSION}"* ]]; then
            echo "::error::expected ${FIXTURE} to resolve ${EXPECTED_VERSION}, got ${actual}"
            exit 1
          fi

  # A partial cache entry is reseeded from the public release, then transferred
  # to a fresh runner. The hit job has no seed-job PATH or env state to reuse.
  setup-wp-cache-seed:
    needs: contract-tests
    runs-on: ubuntu-latest
    env:
      WP_VERSION: "0.0.23"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure writable runner cache
        shell: bash
        run: echo "RUNNER_TOOL_CACHE=${RUNNER_TEMP}/setup-wp-tool-cache" >> "${GITHUB_ENV}"

      - name: Create a partial cache entry
        shell: bash
        run: |
          set -euo pipefail
          expected="${RUNNER_TOOL_CACHE}/wp/${WP_VERSION}/x64/bin/wp"
          legacy="${RUNNER_TOOL_CACHE}/wp/${WP_VERSION}/x64/wp"
          mkdir -p "$(dirname "${expected}")"
          printf '#!/bin/sh\nprintf "WP_PARTIAL_CACHE_POISON\\n" >&2\nexit 42\n' > "${expected}"
          printf '#!/bin/sh\nprintf "WP_PARTIAL_CACHE_POISON\\n" >&2\nexit 42\n' > "${legacy}"
          chmod 0644 "${expected}" "${legacy}"
          if [[ -x "${expected}" || -x "${legacy}" ]]; then
            echo "::error::partial fixture is unexpectedly executable"
            exit 1
          fi
          # Simulate a Kubernetes/ARC runner where ~/.local/share is 0775 (group-writable):
          # setup-wp must provision a private 0700 WP_STATE_ROOT under sticky /tmp so
          # compiled wp's TS7 worker does not panic on a non-sticky writable ancestor.
          xdg_dir="${RUNNER_TEMP}/xdg-data-0775"
          mkdir -p "${xdg_dir}"
          chmod 0775 "${xdg_dir}"
          echo "XDG_DATA_HOME=${xdg_dir}" >> "${GITHUB_ENV}"

      - uses: ./.github/actions/setup-wp
        with:
          version: ${{ env.WP_VERSION }}

      - name: Verify reseed and archive the exact cache subtree
        shell: bash
        run: |
          set -euo pipefail
          cache_root="${RUNNER_TOOL_CACHE}/wp/${WP_VERSION}/x64"
          expected="${cache_root}/bin/wp"
          if [[ ! -x "${expected}" ]]; then
            echo "::error::setup-wp did not safely reseed ${expected}"
            exit 1
          fi
          if [[ -e "${cache_root}/wp" ]]; then
            echo "::error::setup-wp left stale legacy flat file ${cache_root}/wp behind after atomic reseed"
            exit 1
          fi
          if grep -q "WP_PARTIAL_CACHE_POISON" "${expected}"; then
            echo "::error::setup-wp did not replace the partial cache payload"
            exit 1
          fi
          for required in "${cache_root}/manifest.json" "${cache_root}/package-root/package.json" "${cache_root}/wp.sha256"; do
            if [[ ! -f "${required}" ]]; then
              echo "::error::setup-wp did not seed ${required}"
              exit 1
            fi
          done
          "${expected}" --help >/dev/null

          # Prove compiled wp resolves its sibling runtime assets (TS7 worker +
          # package-root) end-to-end against a real vite.config.ts#fmt fixture,
          # including under the simulated 0775 XDG_DATA_HOME via private WP_STATE_ROOT.
          if [[ -z "${WP_STATE_ROOT:-}" || ! -d "${WP_STATE_ROOT}" ]]; then
            echo "::error::setup-wp did not provision private WP_STATE_ROOT for 0775 XDG_DATA_HOME"
            exit 1
          fi
          smoke="${RUNNER_TEMP}/wp-compiled-smoke"
          rm -rf "${smoke}"
          mkdir -p "${smoke}/repo" "${smoke}/stub-bin"
          printf '#!/bin/sh\nexit 0\n' > "${smoke}/stub-bin/vp"
          chmod +x "${smoke}/stub-bin/vp"
          git -C "${smoke}/repo" init -q
          printf '{"name":"smoke","private":true}\n' > "${smoke}/repo/package.json"
          printf 'export default { fmt: { printWidth: 100 } };\n' > "${smoke}/repo/vite.config.ts"
          git -C "${smoke}/repo" add .
          (cd "${smoke}/repo" && PATH="${smoke}/stub-bin:${PATH}" wp format --check)

          tar -C "${RUNNER_TOOL_CACHE}" -czf "${RUNNER_TEMP}/setup-wp-cache.tgz" "wp/${WP_VERSION}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setup-wp-cache
          path: ${{ runner.temp }}/setup-wp-cache.tgz
          if-no-files-found: error
          retention-days: 1

  setup-wp-cache-hit:
    needs: setup-wp-cache-seed
    runs-on: ubuntu-latest
    env:
      WP_VERSION: "0.0.23"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure writable runner cache
        shell: bash
        run: echo "RUNNER_TOOL_CACHE=${RUNNER_TEMP}/setup-wp-tool-cache" >> "${GITHUB_ENV}"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: setup-wp-cache
          path: ${{ runner.temp }}/setup-wp-seed

      - name: Restore the seeded cache into this fresh runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TOOL_CACHE}"
          tar -xzf "${RUNNER_TEMP}/setup-wp-seed/setup-wp-cache.tgz" -C "${RUNNER_TOOL_CACHE}"
          test -x "${RUNNER_TOOL_CACHE}/wp/${WP_VERSION}/x64/bin/wp"

      - uses: ./.github/actions/setup-wp
        with:
          version: ${{ env.WP_VERSION }}
          release-repo: webpresso/does-not-exist

      - name: Verify the fresh runner cache hit
        shell: bash
        run: |
          set -euo pipefail
          expected="${RUNNER_TOOL_CACHE}/wp/${WP_VERSION}/x64/bin/wp"
          if [[ "${WP_INSTALL_DIR}" != "$(dirname "${expected}")" ]]; then
            echo "::error::setup-wp did not publish the cache install directory"
            exit 1
          fi
          if [[ "$(command -v wp)" != "${expected}" ]]; then
            echo "::error::setup-wp did not publish the cache executable"
            exit 1
          fi
          "${expected}" --help >/dev/null

          # Prove the cached whole-tree install resolves sibling runtime assets
          # identically on a fresh runner with zero network access.
          smoke="${RUNNER_TEMP}/wp-compiled-smoke"
          rm -rf "${smoke}"
          mkdir -p "${smoke}/repo" "${smoke}/stub-bin"
          printf '#!/bin/sh\nexit 0\n' > "${smoke}/stub-bin/vp"
          chmod +x "${smoke}/stub-bin/vp"
          git -C "${smoke}/repo" init -q
          printf '{"name":"smoke","private":true}\n' > "${smoke}/repo/package.json"
          printf 'export default { fmt: { printWidth: 100 } };\n' > "${smoke}/repo/vite.config.ts"
          git -C "${smoke}/repo" add .
          (cd "${smoke}/repo" && PATH="${smoke}/stub-bin:${PATH}" wp format --check)

  # The contract suite proves the wait-for-checks polling program against a
  # mocked API. These two jobs prove the composite against the REAL check-runs
  # API on this very commit: one commit, one green check, one name that cannot
  # exist. They are the only part of the action's behaviour a mock cannot
  # establish -- that the endpoint, the default token scope, and the check-run
  # naming are what the program assumes.
  #
  # `uses: ./…` needs a checkout because the action lives in the repo under
  # test; consumers reference it as
  # `webpresso/github-actions/.github/actions/wait-for-checks@<sha>` and need no
  # checkout at all, which is the point of the action being checkout-free.
  wait-for-checks-success:
    needs: contract-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `contract-tests` is completed and green by the time this job starts, so
      # the wait must observe a real success and return promptly.
      - uses: ./.github/actions/wait-for-checks
        with:
          contexts: contract-tests
          timeout-seconds: 120
          poll-interval-seconds: 5

  # The three reusable workflows reference this composite by its REMOTE
  # `owner/repo/path@sha` form, because a relative `uses:` inside a reusable
  # workflow resolves against the CALLER's checkout -- which does not exist
  # before `actions/checkout`, and the gate step must run before it.
  #
  # A remote pin only resolves while the commit stays REACHABLE from a branch.
  # An unreachable pin (the classic source: a squash-merged PR branch that was
  # then deleted) fails with an opaque "workflow file issue" and zero jobs
  # created, which is close to undiagnosable from a consumer's side. This job
  # exercises the exact pinned reference on every pull request, so that failure
  # surfaces here rather than in someone's production deploy. It deliberately
  # takes no checkout: the remote form needs none, which is the whole point.
  wait-for-checks-remote-pin:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: webpresso/github-actions/.github/actions/wait-for-checks@8feb6b86fc96738757ba436c576a5e933d501293
        with:
          contexts: contract-tests
          timeout-seconds: 120
          poll-interval-seconds: 5

  wait-for-checks-bounded-failure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record start time
        shell: bash
        run: |
          set -euo pipefail
          echo "WAIT_START=$(date +%s)" >> "$GITHUB_ENV"

      - id: bounded
        continue-on-error: true
        uses: ./.github/actions/wait-for-checks
        with:
          contexts: this-context-does-not-exist
          timeout-seconds: 30
          poll-interval-seconds: 5

      - name: Assert the wait failed inside its bound and said why
        id: assert
        shell: bash
        env:
          OUTCOME: ${{ steps.bounded.outcome }}
          # The `states` output, not the step summary: the runner gives every
          # step its own GITHUB_STEP_SUMMARY file, so a later step reading that
          # variable would read an empty file and the assertion would be
          # vacuous. (It was, until CI caught it.)
          STATES: ${{ steps.bounded.outputs.states }}
        run: |
          set -euo pipefail
          elapsed=$(( $(date +%s) - WAIT_START ))

          if [[ "${OUTCOME}" != "failure" ]]; then
            echo "::error::expected the bounded wait to fail, got '${OUTCOME}'"
            exit 1
          fi

          # Bounded: a 30s wait that ran for minutes would mean the deadline is
          # not enforced, which is the whole contract.
          if (( elapsed > 90 )); then
            echo "::error::the 30s bounded wait took ${elapsed}s"
            exit 1
          fi

          # A never-observed context and a pending one imply different fixes, so
          # the failure must not conflate them.
          if [[ "${STATES}" != "this-context-does-not-exist=NEVER OBSERVED" ]]; then
            echo "::error::expected a NEVER OBSERVED state for a context that produced no check run, got '${STATES}'"
            exit 1
          fi

          echo "bounded wait failed in ${elapsed}s and reported: ${STATES}"

  # The sign-in step's branches are proven against a stub wp in the contract
  # suite. This job proves the one branch a stub cannot: the in-repo action
  # installs a REAL published pre-login release with auth auto and no
  # id-token (this workflow never grants one), and leaves the job signed out
  # and otherwise unchanged -- the path every caller below the login-only
  # floor takes. Move the version to the login-only release before the
  # pre-login releases are deleted.
  setup-wp-live-skip:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-wp
        with:
          version: 0.0.21
          auth: auto

      - name: Assert wp is installed and sign-in was skipped
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(command -v wp)"
          if [[ "${resolved}" != "${WP_INSTALL_DIR}/wp" ]]; then
            echo "::error::expected wp at ${WP_INSTALL_DIR}/wp on PATH, got '${resolved}'"
            exit 1
          fi
          if [[ -n "${WEBPRESSO_HOME:-}" ]]; then
            echo "::error::sign-in must be skipped below the login-only floor, but WEBPRESSO_HOME is '${WEBPRESSO_HOME}'"
            exit 1
          fi
          echo "setup-wp installed ${resolved} and skipped sign-in"

  # The four reusable workflows reference setup-wp by its REMOTE
  # `owner/repo/path@sha` form, and nothing else in CI resolves that pin: the
  # job above runs the in-repo action. This job runs the exact pinned
  # reference on every pull request, for two properties no YAML reading can
  # establish. Reachability: an unreachable pin fails here with the same
  # opaque "workflow file issue" a caller would see (see
  # wait-for-checks-remote-pin). The pinned commit's sign-in floor: 0.0.23 is
  # a published pre-login release without `wp auth ci`, so with auth auto and
  # no id-token a pin whose floor is 0.0.24 skips sign-in, while a pin whose
  # floor is 0.0.23 or lower demands an id-token and fails with exit 17. Like
  # the job above it takes no id-token, and like wait-for-checks-remote-pin it
  # needs no checkout. Move the version together with setup-wp-live-skip
  # before the pre-login releases are deleted.
  setup-wp-remote-pin:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: webpresso/github-actions/.github/actions/setup-wp@139e85a4e0119ff24f87e32bbc5f9f8a9e838ea0
        with:
          version: 0.0.23
          auth: auto

      - name: Assert wp is installed and was not signed in
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(command -v wp)"
          if [[ "${resolved}" != "${WP_INSTALL_DIR}/wp" ]]; then
            echo "::error::expected wp at ${WP_INSTALL_DIR}/wp on PATH, got '${resolved}'"
            exit 1
          fi
          entitlement="${RUNNER_TEMP}/webpresso/auth/entitlement.jwt"
          if [[ -e "${entitlement}" || -L "${entitlement}" ]]; then
            echo "::error::the pinned setup-wp must not sign 0.0.23 in, but ${entitlement} exists"
            exit 1
          fi
          echo "the pinned setup-wp installed ${resolved} and skipped sign-in"
